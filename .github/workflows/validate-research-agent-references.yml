name: Validate Research Agent References

'on':
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'Research/**/*.md'
      - 'Research/Agent_References/**'
      - '.github/workflows/validate-research-agent-references.yml'
  pull_request:
    paths:
      - 'Research/**/*.md'
      - 'Research/Agent_References/**'
      - '.github/workflows/validate-research-agent-references.yml'

permissions:
  contents: read

jobs:
  validate-research-agent-references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run Research reference tests
        run: python3 -m unittest discover -s Research/Agent_References -p 'test_*.py'
      - name: Validate Research Agent References
        run: python3 Research/Agent_References/validate_agent_references.py
