name: Validate ArcGrav Guide Agent References

'on':
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'ArcGrav/README.md'
      - 'ArcGrav/Guide/Principles/**/*.md'
      - 'ArcGrav/Guide/Syntax/**/*.md'
      - 'ArcGrav/Guide/Patterns/**/*.md'
      - 'ArcGrav/Guide/Agent_References/**'
      - '.github/workflows/validate-arcgrav-guide-agent-references.yml'
  pull_request:
    paths:
      - 'ArcGrav/README.md'
      - 'ArcGrav/Guide/Principles/**/*.md'
      - 'ArcGrav/Guide/Syntax/**/*.md'
      - 'ArcGrav/Guide/Patterns/**/*.md'
      - 'ArcGrav/Guide/Agent_References/**'
      - '.github/workflows/validate-arcgrav-guide-agent-references.yml'

permissions:
  contents: read

jobs:
  validate-agent-references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate arcgrav guide agent references
        run: python3 ArcGrav/Guide/Agent_References/validate_agent_references.py
