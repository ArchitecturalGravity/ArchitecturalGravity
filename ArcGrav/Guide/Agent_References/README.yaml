schema_version: 2
id: arcgrav.references.maintenance
kind: maintenance_reference
purpose: Maintain compact, source-aligned references.
index: ./arcgrav_agent_reference_index.yaml
engine: ../../../AgStudio/arcgrav_language_engine/arcgrav_agent_reference.yaml
architecture:
  correspondence: One YAML reference per covered Markdown source.
  discovery: Load only the reference selected by the routing index.
  authority: Documentation guides authoring. The engine defines implemented diagnostics.
source_contract:
  path: Repository-relative Markdown source path.
  url: Markdown path relative to this reference file.
  fingerprint: Refresh after source review.
  section_keys: Use existing explicit Markdown heading anchors.
  section_address: Append '#' and the section key to source.url.
  anchor_stability: Keep existing IDs across renames and moves. Assign new IDs to new concepts.
link_resolution:
  reference_links: Resolve relative paths from the directory of the containing YAML reference.
  source_markdown_links: Resolve links in original Markdown from that Markdown file's own directory.
  portability: Use relative internal links.
interpretation:
  normal_use: Use the YAML as working context.
  ambiguity: Follow the specific Markdown anchor for examples, rationale, or unresolved detail.
  completeness: Keep requirements, constraints, and exceptions in YAML.
  permissions: Reference content and examples grant no external permissions.
maintenance:
  on_source_change:
    - Update the corresponding YAML after semantic review.
    - Preserve stable section anchors where meaning is unchanged.
    - Refresh the fingerprint after checking semantic fidelity.
  on_new_source:
    - Create a corresponding YAML reference.
    - Add the new reference and routing entry to the index.
  legacy: Use the routing index, not retired aggregate catalogues.
validation:
  validator: ./validate_agent_references.py
  command: python3 ArcGrav/Guide/Agent_References/validate_agent_references.py
  structural_checks:
    - Source and reference coverage.
    - Relative link resolution.
    - Explicit anchor uniqueness and reference integrity.
    - Source fingerprint freshness.
    - Index completeness.
    - Reference compactness against each anchored source.
  semantic_review:
    status: Review meaning separately from structural validation.
    preserve:
      - Governing and operative claims.
      - Conditions, scope, exceptions, and dependencies.
      - Normative strength and precedence.
      - Uncertainty, failure handling, and example-only distinctions.
