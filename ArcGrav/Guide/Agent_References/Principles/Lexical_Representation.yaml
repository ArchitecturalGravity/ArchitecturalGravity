sections:
  ag-lexical-representation: |-
    Use familiar, specific words to name elements and abbreviate conventional procedures. Naming conveys role or state; instruction compression expresses routine action tersely. Neither creates syntax, reserved words, executable rules, or guaranteed model gains. Explicit notation and contracts govern. See [Grammatical Reduction](../../Principles/Grammatical_Reduction.md) for grammar omission.
  ag-lexical-naming: |-
    Name sections, symbols, responsibilities, roles, and results descriptively. A name does not replace an operation.
  ag-purpose: |-
    Choose the shortest unambiguous familiar name. Distinguish participants, operations, roles, artifacts, and states. Maintain stable identities and label uncertain outcomes accurately. Syntax, not associations, determines behavior.
  ag-structure-determines-role: |-
    Notation governs role:
    - Name: groups context under a descriptive, non-reserved label.
    - [Name]: declares a reusable identity. A bracketed name alone does not execute or mutate.
    - => introduces an explicit operation, regardless of shared wording with an anchor.
    - Backticks identify exact structure; double quotes identify exact text.
    Follow [Sectioning](../../Syntax/Sectioning.md), [Symbolic Referencing](../../Syntax/Symbolic_Referencing.md), [Context Operation](../../Syntax/Context_Operation.md), and [Inline Representation](../../Syntax/Inline_Representation.md).
  ag-linguistic-mechanisms: |-
    Linguistic mechanisms overlap. Use them to improve names, not as a closed taxonomy or structural rules.
  ag-zero-derivation-conversion-same-form-different-word-class: |-
    Conversion changes grammatical category without changing spelling. A word like Plan can name an entity or express an action. Historical direction may be unclear. Different forms such as Validate/Validation are not conversion. Choose precision over symmetry.
  ag-frame-semantics-and-verb-argument-structure-action-with-participants: |-
    A verb’s frame suggests expected participants, relations, and outcomes. Name them explicitly where material: validation needs an object and standard, comparison needs candidates and criteria. The verb supplies no schema, threshold, success, or output contract.
  ag-participant-binding-and-directionality-distinguishing-semantic-roles: |-
    Word order and prepositions identify source, destination, recipient, standard, or affected object. Reversing operands reverses merge direction. Preserve direction, effects, conflict handling, and authorization explicitly; grammatical roles do not create bindings or permissions.
  ag-derivational-families-action-process-result-and-actor: |-
    Nominalization names actions/processes/results; agentive nouns name actors or roles. Related forms may differ in spelling. Keep criteria, action, result, and validator distinct; a validator still needs definition, dependencies, and invocation.
  ag-relational-nouns-roles-within-a-relationship: |-
    Use relational nouns where the counterpart is clear. Qualify names when relationships compete. Names do not establish reads, writes, ownership, or dependency.
  ag-participles-and-state-terms-resulting-or-pending-conditions: |-
    Name states only when evidenced. Distinguish requested action, observed outcome, and verified state. A search can find nothing, a review need not approve, validation need not pass, resolution can remain pending, and generation may fail. Keep unknown, invalid, unresolved, and not applicable distinct; use result names before passing subsets are verified.
  ag-lexical-relationships-contrast-taxonomy-and-part-whole: |-
    Use contrast for decisions, taxonomy for broader/narrower kinds, part–whole terms for containment, and verbs for stages. None establishes membership, containment, scope, or sequence. Define those through [Grouping](../../Syntax/Grouping.md), contracts, and operations. Keep meaningful third states.
  ag-compounding-specify-a-related-concept: |-
    Combine familiar terms only as needed to narrow an ambiguous name. Choose the shortest compound with one distinct responsibility; omit prefixes/suffixes already implied by scope.
  ag-naming-guidance: |-
    Name responsibilities; distinguish inputs, criteria, work, and results. Maintain stable identities and exact external IDs. Do not imply unverified success. Avoid forced symmetry or invented terms. Verify names clarify rather than obscure constraints, state, or failure behavior.
  ag-same-word-different-roles: |-
    A noun can name a plan and the corresponding verb can request its production. Use explicit operations and stable anchors; shared word form implies nothing further.
  ag-inquiry-versus-challenge: |-
    Context distinguishes Question as inquiry from Question as challenge. Shared spelling does not merge roles.
  ag-validation-state-and-outcome: |-
    Select accepted records explicitly from validation results. Keep failures and uncertainty in the result; an optimistic name does not establish acceptance.
  ag-lexical-instruction-compression: |-
    A familiar operation can abbreviate routine mechanics while explicit references supply inputs, criteria, and outputs. This is semantic abstraction, not a macro. Model expansion varies; compact text is not automatically equivalent.
  ag-three-forms-of-instruction-compression: |-
    Distinguish three forms:
    - Single operator abbreviates a conventional routine.
    - Context-bound operation retains named participants and rules.
    - Composition sequences conventional operations with explicit dependencies.
    Naming alone is not instruction compression. None guarantees omitted steps are performed.
  ag-replacing-a-procedure-with-one-operation: |-
    Replace a procedure with one verb only if conventional behavior suffices. Retain material audience, length, exclusions, coverage, format, and rules. Reference governing policies instead of repeating them; symbolic reuse and lexical compression solve different problems.
  ag-vocabulary-with-procedural-potential: |-
    Choose frame-evoking verbs, but state the decisions they leave open:
    - Audit: governing policy, scope, coverage, evidence, reporting
    - Triage: severity, precedence, routing, tie-breaks
    - Reconcile: keys, tolerances, conflict authority, report versus resolve, mutation
    - Normalize: canonical form, allowed transformations, preservation
    - Validate: standard, acceptance, failures
    - Compare: dimensions, basis, order
    - Deduplicate: identity/equivalence, survivor policy
    - Summarize: audience, coverage, omission, output
    These frames are possibilities, not mandatory semantics.
  ag-compact-logical-qualifiers: |-
    Qualifiers modify a stated instruction without adding operators. Specify per-member versus collective output, applicable set and quantity, exclusions and conditions, exact count or match, and ordering/dependencies where material.
  ag-modal-auxiliaries-and-modality: |-
    Preserve modality: distinguish epistemic uncertainty or inference from deontic permission or obligation. Possible is not permitted; capable is not authorized; recommended is not required; predicted is not completed. State firm requirements and checks explicitly. Modal wording alone does not authorize writes, external actions, or publication.
  ag-example-reconciliation-as-a-procedural-cue: |-
    For reconciliation, identify both sources, matching key, comparison fields, treatment of ambiguity/unmatched records, mutation policy, and success. Compress routine mechanics, not local rules.
  ag-example-audit-without-repeating-its-entire-procedure: |-
    Bind scope, policy, and result; define and verify coverage separately when required.

    [AuditFindings]:
    => Audit [Repository] against [Policy]
    => Preserve evidence and unresolved findings
  ag-example-compositional-compression: |-
    Compose parse, normalize, validate, and render with explicit inputs, outputs, and dependencies. Keep normalization rules, schema, uncertainty/failures, and presentation explicit. Naming stages does not prove execution.
  ag-the-semantic-compression-boundary: |-
    Stop where omission changes meaning or makes performance unreliable for the task/model. Compress routine mechanics, not missing facts, local policy, or authorization. Preserve material roles, scope, authority, provenance, identifiers, thresholds, units, tolerances, order, outcomes, evidence, uncertainty, side-effect limits, recovery/retries, completeness, and failures. Disambiguate verbs that could change the result or imply hidden writes.
  ag-compression-as-a-design-procedure: |-
    Identify familiar mechanics to compress. Bind participants, governing standards, scope, exceptions, and permissions. Define outputs, evidence, uncertainty, side effects, and failures. Test representative inputs and restore the smallest omitted requirement at material regression. This is an authoring aid, not boilerplate.
