sections:
  ag-lexical-representation: |-
    ArcGrav uses lexically familiar words to name sections, symbolic references, operations and instructions.
    By choosing highly specific words whose established meanings and relationships communicate an element's responsibility, participants, or expected state with minimal explanation, *far more* can be conveyed with *fewer words*. This naming strategy adds contextual value to surrounding relationships without adding additional prose, which improves model inference while consuming less tokens. Since the model already understands the framing of this vocabulary, it casts that meaning onto related ArcGrav structures, which amplifies their specificity.
    **Lexical Naming** — selecting clear section and symbolic-reference names that convey an element's identity, role, or expected state.; **Lexical Instruction Compression** — using familiar action words to abbreviate conventional procedural instructions without omitting necessary task-specific requirements.
    **Note:** This is design guidance, not a new ArcGrav syntax primitive, a set of reserved words, an execution rule, or a guarantee of improved model performance. Structural notation and explicit contracts take precedence over lexical associations.
    **Related principle:** [Grammatical Reduction](../../Principles/Grammatical_Reduction.md) covers contextual omission and grammatical simplification independently of lexical naming and procedural compression.
  ag-lexical-naming: |-
    This section addresses **element names**: which words label sections, symbolic contexts, responsibilities, roles, and results. A descriptive name can convey meaning, but it does not replace the instructions needed to perform an operation.
  ag-purpose: |-
    Choose familiar words and compounds to make section and symbol responsibilities recognizable.; Distinguish operations, participants, roles, artifacts, and states without conflating identities.; Preserve stable symbolic references and accurate names for uncertain or incomplete outcomes.; Let ArcGrav's established structure establish role; lexical associations do not create behavior.
    The objective is the shortest **unambiguous name**, not naming symmetry for its own sake.
  ag-structure-determines-role: |-
    A word may evoke several meanings, but **ArcGrav notation determines how it is represented**:
    Representation / Structural role / Example ; Plain section, `Name:` / Groups context under a descriptive role / `Task:`, `Question:` ; Symbolic declaration, `[Name]:` / Creates a reusable context identity / `[Plan]:`, `[ReviewFindings]:` ; Operation, `=> Verb ...` / Expresses an action or transformation / `=> Review [Plan]` ; Exact structural identifier / Preserves an exact field, key, or member / `` `reviewStatus` `` ; Exact textual value / Preserves literal text / `"pending review"`
    Section labels are descriptive, not reserved keywords. A bracketed symbol alone does not execute or mutate anything; it must be declared and subsequently referenced. An operation remains explicit even when its verb shares a form or root with an anchor's name.
    These conventions follow [Sectioning](../../Syntax/Sectioning.md), [Symbolic Referencing](../../Syntax/Symbolic_Referencing.md), [Context Operation](../../Syntax/Context_Operation.md), and [Inline Representation](../../Syntax/Inline_Representation.md).
  ag-linguistic-mechanisms: |-
    The following are **overlapping linguistic phenomena**, not a closed taxonomy of ArcGrav elements. They can inform naming without determining structure or behavior.
  ag-zero-derivation-conversion-same-form-different-word-class: |-
    **Zero-derivation** (often called **conversion**) changes grammatical category without changing word form. In noun/verb conversion, one spelling can serve as an entity, activity, or result.
    Word / Noun meaning / Verb meaning ; `Task` / Assigned work / Assign work ; `Question` / An inquiry / Ask about or challenge something ; `Plan` / An intended course of action / Develop a course of action ; `Review` / An examination or its result / Examine ; `Test` / A trial or check / Try or check ; `Report` / A communicated account / Communicate findings
    The historical direction of conversion is not always certain. Related words with different forms, such as `Validate` / `Validation`, are not instances of zero-derivation. Choose terms for precision, not noun/verb symmetry; these examples are not reserved keywords.
  ag-frame-semantics-and-verb-argument-structure-action-with-participants: |-
    A familiar verb can evoke a conceptual **frame**: a type of situation with expected participants, relationships, and sometimes an outcome. Its **argument structure** suggests which inputs or criteria are relevant.
    Verb / Semantically relevant participants / ArcGrav naming opportunity ; `Validate` / Object being checked; applicable standard / `[ValidationResult]`, `[Schema]` ; `Compare` / Two or more candidates; comparison dimension / `[Comparison]`, `[Criteria]` ; `Transform` / Source; desired target or transformation rule / `[Source]`, `[Target]` ; `Resolve` / Conflict or uncertainty; governing evidence or authority / `[Resolution]`, `[Evidence]` ; `Assign` / Work or responsibility; recipient / `[Task]`, `[Owner]`
    For example, `=> Validate [Records] against [RecordSchema]` explicitly identifies an object and a standard. The verb does not invent the schema, establish an acceptance threshold, guarantee success, or determine the output format.
    **Naming principle:** Use familiar verbs to select meaningful names for participants and results. Naming alone does not specify how much operational detail may be omitted.
  ag-participant-binding-and-directionality-distinguishing-semantic-roles: |-
    A familiar verb suggests participants, but its grammatical construction influences how their roles are expressed. Word order and prepositions can distinguish sources, destinations, recipients, standards, and affected objects. A shared verb and shared participants do not make two expressions interchangeable.
    Expression / Semantically relevant distinction ; `=> Merge [Patch] into [Baseline]` / `[Patch]` is presented as input; `[Baseline]` as the destination ; `=> Merge [Baseline] into [Patch]` / `[Baseline]` is presented as input; `[Patch]` as the destination ; `=> Validate [Records] against [Schema]` / `[Records]` is checked; `[Schema]` supplies the standard
    The two `Merge` expressions reverse the presented direction. Neither specifies how conflicts are handled, whether a destination is modified, or whether modification is authorized. When direction, affected participants, or side effects matter, preserve those relationships explicitly in the operation and its governing context.
    **Interpretive principle:** Grammatical relationships can clarify participant roles; they do not independently create ArcGrav bindings, mutation rules, or permissions.
  ag-derivational-families-action-process-result-and-actor: |-
    Related word forms can give separate names to activities, their processes or products, and the actors responsible for them.
    Verb / Process or result noun / Agentive or role noun ; `Validate` / `Validation` / `Validator` ; `Review` / `Review` / `Reviewer` ; `Resolve` / `Resolution` / `Resolver` ; `Analyze` / `Analysis` / `Analyst`
    **Nominalization** supplies noun forms for actions, processes, or results. **Agentive nouns** identify agents or roles. These relationships do not require identical spelling and are therefore distinct from zero-derivation.
    In ArcGrav, `[ValidationCriteria]` can name a standard, `=> Validate` an action, `[ValidationResult]` an output, and `[Validator]` a reusable role or component. They share a semantic family but **must not be treated as interchangeable identities**.
    Do not assume that declaring `[Validator]` creates a working validator. The element must still have its required definition, dependencies, and invocation.
  ag-relational-nouns-roles-within-a-relationship: |-
    Nouns such as `Source`, `Target`, `Owner`, `Dependency`, `Parent`, `Member`, and `Output` describe entities partly through their relationships to others.
    For example, `[Source]` and `[Target]` suggest direction in `=> Generate [Target] from [Source]`, but the operation explicitly establishes the transformation. Names alone do not imply a read, write, ownership relation, or dependency edge.
    Use relational names when their counterpart or governing relationship is clear. Prefer `[PolicyOwner]` over `[Owner]` when multiple ownership relationships coexist.
  ag-participles-and-state-terms-resulting-or-pending-conditions: |-
    Participles and state adjectives help communicate lifecycle stages: `Parsed`, `Normalized`, `Validated`, `Resolved`, `Pending`, and `Rejected`.
    Name / Plausible interpretation / Important qualification ; `[ParsedRecords]` / Records resulting from parsing / Parsing must actually have occurred ; `[ValidatedRecords]` / Records that passed validation / Not merely records *submitted* for validation ; `[Resolution]` / Outcome of an attempt to resolve / May legitimately remain unresolved ; `[PendingItems]` / Items awaiting a decision / Define what moves them out of pending
    A **name is not evidence of state**. Avoid `[ValidatedRecords]` when the data may contain failures; choose `[ValidationResult]` until the passing subset is established. Preserve `unknown`, `invalid`, `unresolved`, and `not applicable` as distinct outcomes when relevant.
    An operation's verb may suggest a process or intended outcome without establishing that the outcome occurred. This distinction applies to actions as well as result names.
    Operation / Distinction to preserve ; `Search` / A search may find no matches ; `Review` / Examination does not imply approval ; `Validate` / Checking does not imply that a target passed ; `Resolve` / Attempted resolution may leave conflicts unresolved ; `Generate` / A requested artifact may be incomplete or unavailable
    `[ResolutionResult]` can represent outcomes of the attempt without assuming all conflicts were resolved. Distinguish the **action requested**, **outcome observed**, and **state verified** before choosing a name that implies completion or success.
  ag-lexical-relationships-contrast-taxonomy-and-part-whole: |-
    Other semantic relationships can guide coherent sets of names.
    Relationship / Example / Possible use / Limit ; Antonymy or contrast / `Accept` / `Reject`; `Valid` / `Invalid` / Distinguish opposite decisions or statuses / Opposites need not exhaust all outcomes ; Hypernymy / hyponymy / `Resource` → `File` → `ConfigurationFile` / Name broader and narrower categories / A name alone does not establish subset membership ; Meronymy / holonymy / `Component` / `System`; `File` / `Repository` / Suggest part–whole structure / Actual containment must be defined ; Related process phases / `Parse` → `Validate` → `Render` / Name a sequence of responsibilities / The ordering still requires explicit control
    A lexical relationship is **not automatically an ArcGrav structural relationship**. Explicit [Grouping](../../Syntax/Grouping.md), scope, contracts, and operation order remain necessary.
    In particular, binary words such as `Valid` and `Invalid` must not erase meaningful third states such as `Unresolved`.
  ag-compounding-specify-a-related-concept: |-
    Compound names combine familiar terms to narrow the intended meaning when a single word would be ambiguous.
    Ambiguous / More precise ; `[Review]` / `[ReviewCriteria]`, `[ReviewFindings]` ; `[Model]` / `[RiskModel]`, `[RecordModel]` ; `[Result]` / `[ValidationResult]`, `[ComparisonResult]` ; `[Owner]` / `[PolicyOwner]`, `[TaskOwner]`
    Prefer the shortest compound that uniquely identifies one responsibility. Do not add prefixes or suffixes that merely repeat context already unambiguous at the element's scope.
  ag-naming-guidance: |-
    1. **Name the semantic responsibility first.** Choose familiar words or the shortest unambiguous compounds.; 2. **Separate roles and outcomes.** Distinguish participants, criteria, activities, and artifacts; prefer `[ReviewFindings]` for the output of `=> Review` and `[ReviewCriteria]` for its standard.; 3. **Represent state truthfully.** Do not imply successful validation, resolution, or acceptance until established; keep invalid and unresolved outcomes distinct.; 4. **Let syntax govern structure.** Sections, symbols, operations, and exact values follow [Sectioning](../../Syntax/Sectioning.md), [Symbolic Referencing](../../Syntax/Symbolic_Referencing.md), [Context Operation](../../Syntax/Context_Operation.md), and [Inline Representation](../../Syntax/Inline_Representation.md). Lexical relationships do not create behavior or structural relationships.; 5. **Keep identities precise and stable.** Disambiguate polysemy (for example, `[RiskModel]` versus `[RecordModel]`), preserve exact external identifiers, and do not silently change a symbol's meaning.; 6. **Avoid forced symmetry and invented vocabulary.** Established terms such as `Constraint` and `Execution` need not form same-word noun/verb pairs.; 7. **Verify usability, not wordplay.** Naming should improve interpretation without hiding constraints, state, or failure behavior.
  ag-same-word-different-roles: |-
    The noun `Plan` names a derived artifact, while `Plan` as a verb describes its production. `Review` names an operation; `ReviewFindings` names its output.
    [Scope]: - src/auth/*
    [Constraints]: - Preserve the public API
    [Plan]: => Plan modifications within [Scope] under [Constraints]
    Bracketed names provide stable references; the operations remain explicit. The shared word forms do not imply additional operations.
  ag-inquiry-versus-challenge: |-
    `Question:` can label a request for an answer:
    Question: - Which requirement has not been satisfied?
    [Assumptions]: - The external API will remain unchanged
    The surrounding context selects the intended sense; shared spelling does not merge the two roles.
  ag-validation-state-and-outcome: |-
    [Records]: - Imported records
    [AcceptedRecords]: => Select only passing records from [ValidationResult]
    `[AcceptedRecords]` is justified by an explicit selection rule, not merely by the positive-sounding name. `[ValidationResult]` retains failures and uncertainty separately from the accepted subset.
  ag-lexical-instruction-compression: |-
    **Lexical instruction compression** is the deliberate use of familiar verbs or concise expressions to evoke *conventional procedural meaning* that would otherwise be spelled out across multiple instruction lines. It concerns the **content of operations**, not the naming of elements.
    A model may associate `Audit` with inspection against standards, `Triage` with classification and prioritization, and `Reconcile` with matching and accounting for differences. In ArcGrav, the operation verb can evoke this process, while named references supply its inputs, criteria, and expected output.
    The result is **semantic abstraction**, not a macro or hidden executable primitive. Two models may expand the same word differently. A compact expression is not automatically equivalent to a longer specification.
  ag-three-forms-of-instruction-compression: |-
    Form / Mechanism / Example / What can be shortened ; Single-operator / A familiar verb summarizes a conventional routine / `=> Summarize [ReleaseNotes]` / Generic steps for reading, selecting main points, and condensing ; Context-bound / The verb's conventional procedure is constrained by explicit participants and rules / `=> Reconcile [Transactions] with [Ledger] under [ReconciliationRules]` / Repeated explanations of reconciliation while preserving the actual matching policy ; Compositional / Several conventional operations are arranged as an explicit workflow / `Parse` → `Normalize` → `Validate` → `Render` / Routine descriptions of each stage without omitting the dependencies
    These are **forms of procedural abbreviation**, not ArcGrav execution levels. **Choosing a descriptive name is not counted as an instruction-compression form.** Explicit operations still govern what is requested, and the vocabulary cannot guarantee that omitted steps will be performed.
  ag-replacing-a-procedure-with-one-operation: |-
    Where the desired outcome is conventional and no additional requirements apply, one semantic operator may stand in for several explanatory steps:
    `Summarize` can replace instructions such as *read the announcement*, *identify its main points*, and *produce a shorter account*. This is appropriate only when an ordinary summary is sufficient. Required audience, length, exclusions, factual coverage, or output format must still be specified when material.
    [ReconciliationRules]: - Match by `transactionId` - Compare `amount` and `date` - Keep ambiguous and unmatched entries - Never modify source records
    The rules remain explicit, but need not be restated inside each invocation. This combines **lexical procedural compression** with ArcGrav's **symbolic reuse**; neither mechanism substitutes for the other.
  ag-vocabulary-with-procedural-potential: |-
    Frame-evoking verbs are often more suitable for procedural compression than noun/verb conversion alone: they suggest recognizable activities, rather than merely sharing a word form.
    Word / Conventional procedure it may evoke / Decisions to keep explicit when material ; `Audit` / Inspect a target against a governing standard and identify deviations / Scope, authoritative policy, evidence, coverage, reporting rules ; `Triage` / Assess, categorize, and prioritize incoming items / Severity criteria, precedence, routing, tie-breaking ; `Reconcile` / Match sources and account for discrepancies / Matching keys, tolerances, conflict authority, mutation policy ; `Normalize` / Convert inconsistent representations toward a consistent form / Canonical representation, allowed transformations, preservation rules ; `Validate` / Check candidates against requirements / Schema or standard, acceptance criteria, failure behavior ; `Compare` / Examine multiple candidates along common dimensions / Dimensions, comparison basis, ordering ; `Deduplicate` / Detect and handle repeated records / Identity key, equivalence policy, survivor selection ; `Summarize` / Condense material while retaining its main information / Audience, required coverage, omission rules, output shape
    The listed procedures are **possible interpretations** of the words, not mandatory semantics. For example, `Reconcile` might mean *report discrepancies* or *actively resolve them*. A requirement distinguishing those behaviors must not be omitted.
  ag-compact-logical-qualifiers: |-
    Familiar qualifiers can shorten **conditions, scope, quantity, and sequencing instructions**. Unlike verbs such as `Audit` or `Reconcile`, these words do not evoke an entire conventional procedure: they qualify an explicitly stated instruction.
    Qualifier / Conventional contribution / Distinction to preserve ; `each`, `individually` / Apply an action per member / Collection and per-member output ; `all`, `some`, `any` / Quantify the applicable set / Whether every member, a subset, or at least one is intended ; `only`, `except`, `unless` / Restrict scope or establish exceptions / Included items, excluded cases, and governing condition ; `exactly` / Require a precise count or match / What is being counted or matched ; `before`, `after` / Express ordering / Events, dependencies, and conditions for proceeding
    Scope can change the intended result even when the verb and input reference remain the same. For example, these are distinct requests:
    The first suggests a summary for every file; the second suggests a single summary of the collection. Neither determines the required length or output format. Define conditions, operands, quantities, and order when correctness depends on them. These qualifiers do not create implicit ArcGrav operators.
  ag-modal-auxiliaries-and-modality: |-
    **Modal auxiliary verbs** such as `may`, `should`, and `must` qualify an action or statement by expressing possibility, permission, expectation, or obligation. They do not name a conventional procedure. Their meaning depends on the statement and its governing context.
    Two distinctions are particularly useful: **epistemic modality** expresses uncertainty or inference (for example, `may be incomplete` or `must be incorrect`), while **deontic modality** expresses permission or obligation (for example, `may exclude` or `must preserve`). A modal such as `should` can express a recommendation or an expectation rather than a strict requirement.
    Modal / Conventional meanings / Distinction to preserve ; `may`, `might` / Possibility; `may` can also express permission / Uncertain outcome versus allowed action ; `can`, `could` / Ability or possibility; `can` can also express permission / Capability versus permission or requirement ; `should` / Recommendation or expectation / Preferred behavior versus required behavior ; `must` / Obligation or strong inference / Mandatory action versus inferred conclusion ; `will`, `would` / Prediction, intention, or hypothetical consequence / Expected outcome versus established result ; `shall` / Formal obligation or future intention / Contractual requirement versus prediction
    [ReviewRules]: - Every finding must include supporting evidence - Unresolved findings may remain pending - Recommendations should suggest a next step
    Here `must` states a requirement, `may` permits a pending outcome within the review rules, and `should` communicates a recommendation rather than a mandatory acceptance condition. If a recommendation must be enforced, state it as a requirement and define its verification criteria.
    **Interpretive principle:** Preserve the intended modal sense when compressing instructions. Possibility is not permission, capability is not authorization, and prediction is not proof of completion. Modal language does not independently authorize external actions, writes, or publication; explicit permissions and boundaries still govern those operations.
  ag-example-reconciliation-as-a-procedural-cue: |-
    `Reconcile` evokes matching, comparison, and discrepancy reporting. In the earlier `[ReconciliationRules]` example, `[Transactions]` and `[Ledger]` identify the participants while the rules specify the matching key, comparison fields, uncertainty handling, and prohibition on source modification.
    By contrast, `=> Reconcile transactions` omits the comparison source and the meaning of a successful reconciliation. **Lexical compression abbreviates conventional mechanics, not task-specific accounting policy.**
  ag-example-audit-without-repeating-its-entire-procedure: |-
    [Repository]: - src/auth/*
    [AuditFindings]: => Audit [Repository] against [Policy] => Preserve evidence and unresolved findings
    `Audit` suggests inspection against a standard; `[Repository]`, `[Policy]`, and `[AuditFindings]` identify scope, standard, and output. The verb does not guarantee exhaustive inspection or defect discovery; define and verify coverage separately when required.
  ag-example-compositional-compression: |-
    A sequence of semantically rich operations communicates a larger transformation without repeating each phase's routine mechanics:
    [ValidationResult]: => Validate [NormalizedRecords] against [Schema] => Preserve failures and unresolved values
    The verbs evoke conventional stages; declarations and references identify their inputs and outputs. Normalization rules, schema, uncertainty handling, and presentation requirements remain explicit. Stage names alone do not prove that the operations ran.
  ag-the-semantic-compression-boundary: |-
    The **semantic compression boundary** is the point beyond which omitting further instruction changes the intended meaning or makes reliable performance unacceptable. It is a *task- and model-dependent evaluation concept*, not a universal token threshold.
    Information / Compression guidance ; Conventional mechanics of a well-understood routine / Candidate for lexical compression ; The intended participants and their semantic roles / Use explicit references when ambiguity matters ; Scope, authority, input provenance, and governing policies / Keep explicit when relevant to correctness ; Identity rules, thresholds, units, tolerances, and ordering / Keep explicit unless truly defined by authoritative context ; Accepted outputs, required evidence, and uncertainty handling / Define when needed for verifiability ; External actions, writes, permissions, publication, or destructive behavior / Require explicit authorization and boundaries ; Recovery, retries, completeness criteria, and failure handling / State when they materially affect outcomes
    A short word can carry a strong association with a procedure but **cannot supply organization-specific policy, missing facts, or permission to act**. It may also evoke multiple legitimate procedures.
    Practical failure modes include:
    **Polysemy:** `Resolve` could mean explain a conflict, choose a winner, or perform a modification.; **Unstated defaults:** `Normalize` does not identify the target normalization rules.; **Overgeneralization:** `Audit` does not ensure complete coverage or an authoritative standard.; **Completion confusion:** invoking `Validate` does not establish that any record passed; check and preserve its actual outcome.; **Hidden side effects:** `Publish` should not by itself authorize sending, deploying, or exposing data.
    Prefer a more specific lexical operator or a short additional constraint whenever these interpretations would produce materially different results.
  ag-compression-as-a-design-procedure: |-
    1. **Identify conventional mechanics.** Find explanatory steps a familiar verb can replace.; 2. **Bind the frame and preserve specifics.** Supply participants, standards, scope, exceptions, permissions, and governing requirements explicitly.; 3. **Define outcomes and failure behavior.** Specify output shape, evidence, uncertainty, and side-effect boundaries when material.; 4. **Validate and restore what matters.** Test the compact form on representative inputs; reintroduce the smallest omitted instruction at the first material regression.
    This procedure is an authoring aid, not required prompt boilerplate.
