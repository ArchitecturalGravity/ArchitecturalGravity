sections:
  ag-grammatical-reduction: |-
    Omit or simplify grammar only when remaining words, explicit references, or governing context recover its contribution. Aim for the shortest sufficiently unambiguous instruction, not stop-word deletion. No new syntax, reserved words, or performance guarantee. Honor notation, exact values, and contracts.
  ag-purpose: |-
    Remove scaffolding without changing action, participants, relationships, scope, conditions, or output. Restore wording if ambiguity appears; omissibility depends on context, not word class.
  ag-linguistic-basis: |-
    Function words can encode meaning. Ellipsis omits recoverable material; telegraphic style abbreviates expression. Neither grammaticality nor readability nor an NLP stop-word list proves safe omission.
  ag-contextual-omissibility: |-
    Omit an article before a unique declared symbol only when identity stays fixed. Indefinite and definite references can select different entities. Remove recoverable contributions, not just common words.
  ag-reduction-mechanisms: |-
    Consider omitting articles before fixed identities or optional “that,” simplifying a partitive while retaining its quantifier, and shortening purpose phrases. Use label-value form instead of a copular status statement only when accurate. Rewriting is not mere deletion; preserve tense, status, voice, and modality. Savings depend on tokenizer.
  ag-function-word-categories: |-
    Check function words by role:
    - Determiners: identity or specificity
    - Complementizers: clause clarity
    - Auxiliaries and copulas: tense, aspect, voice, obligation
    - Prepositions: participant roles and direction
    - Conjunctions and conditionals: logic
    - Modals and quantifiers: permission, obligation, coverage
    No category is universally removable.
  ag-semantic-preservation: |-
    Preserve exact identities, source/destination, comparison standards, negation, exceptions, quantifiers, scope, order/dependencies, modality, authorization, state, uncertainty, failures, and literal values. Preserve exact syntax, quoted text, keys, paths, and fixed outputs. Follow [Symbolic Referencing](../../Syntax/Symbolic_Referencing.md), [Context Operation](../../Syntax/Context_Operation.md), and [Inline Representation](../../Syntax/Inline_Representation.md).
  ag-arcgrav-applications: |-
    Use declared symbols to recover identity and abbreviate articles or partitives. Keep coverage (“all”), membership (“in”), standard (“against”), declarations, and operations. Shortening does not imply success or alter the contract.
  ag-safe-and-unsafe-examples: |-
    Check omissions against their effects: article before fixed symbol or optional “that” may be safe. Direction words, negation, scope limiters, per-item quantifiers, approval and identity markers are not expendable where operative.
  ag-reduction-guidance: |-
    Identify action, participants, relations, scope, modality, constraints, and output. Remove the smallest recoverable span, then recheck material distinctions and exact text. Restore wording if behavior diverges. Test representative inputs and measure with the target tokenizer. Do not add this procedure as boilerplate.
  ag-evaluation-and-limitations: |-
    Assess meaning separately from token cost. Compare original and reduced instructions on normal, ambiguous, and failed cases for selected outputs, permissions, conditions, effects, and failure reporting. Material regressions outweigh savings. Results vary with model, language, domain, context, and examples.
  ag-relationship-to-other-principles: |-
    [Lexical Representation](../../Principles/Lexical_Representation.md) increases meaning carried by familiar terms. Reduction omits recoverable grammar. [Symbolic Referencing](../../Syntax/Symbolic_Referencing.md) avoids repeated context; [Sectioning](../../Syntax/Sectioning.md) and [Context Operation](../../Syntax/Context_Operation.md) express roles and actions. None replaces required information.
