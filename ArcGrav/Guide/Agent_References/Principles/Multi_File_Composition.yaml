source:
  path: ArcGrav/Guide/Principles/Multi_File_Composition.md
  url: ../../Principles/Multi_File_Composition.md
  fingerprint: fnv1a32-38f5cb16
sections:
  ag-using-multiple-arcgrav-instruction-files: |-
    Keep the primary sequence in the entry file. Separate responsibilities and load supporting context only at use. Share rules; isolate logic, data, and templates where useful.
  ag-declare-and-bind: |-
    Declare the child symbol with a relative or absolute file path under Resolves:. Import only needed, already-defined bindings. Mirror the identical Import: list at the top of the child. Run the child symbol to follow its Task:. If the child supplies rules or operations without a Task:, apply them at use. Give writer and reader an existing path binding; run the writer first.

    The child imports [Item] from SKILL.txt. AgStudio cannot resolve it by analyzing the child alone.

    SKILL.txt:

    Scope:
    - Report an item

    [Item]: Mint tea

    [Report]:
    1. Resolves: references/report.txt
    2. Import: [Item]

    Task:
    1. Run [Report]

    references/report.txt:

    Import:
    - [Item]

    Task:
    1. Output [Item]
  ag-shared-instructions-different-imports: |-
    Share a rule across siblings with different inputs. Resolve both child paths from SKILL.txt.
  ag-multi-file-greet-sign-off-entry: |-
    Bind the shared line rule once. Give the greeting the guest name and the sign-off the closing phrase.
  ag-multi-file-greet-sign-off-greet: |-
    Form a greeting from the guest name. Apply the line rule.
  ag-multi-file-greet-sign-off-sign-off: |-
    Output the closing phrase under the shared line rule. Do not import the guest name.
  ag-multi-file-greet-sign-off-walkthrough: |-
    Run greeting then sign-off. Each outputs one line ending in a period.
  ag-file-backed-rule: |-
    Pass a file-backed rule. Follow the path at Apply and use the rule on local child data without running the rules file as a separate task.
  ag-multi-file-shelf-capacity-entry: |-
    Bind the rules path; pass it as the checker’s only import; Run the checker.
  ag-multi-file-shelf-capacity-check-capacity: |-
    Define shelf counts locally. Apply imported rules and report the decision.
  ag-multi-file-shelf-capacity-storage-rules: |-
    Each incoming box uses one slot. Allow loading only if at least one slot remains afterward.
  ag-multi-file-shelf-capacity-walkthrough: |-
    Match imports at Run. Resolve the rules path from SKILL.txt at Apply. Reject a load that leaves no free slot.
  ag-worked-example: |-
    Separate data, literal template, and logic. Pass both bindings to the formatting child; resolve paths from SKILL.txt.
  ag-multi-file-label-template-entry: |-
    Bind the input path in SKILL.txt, declare the literal template inline, and pass both to the child.
  ag-multi-file-label-template-label-input: |-
    Supply lowercase name, type, and caffeine values.
  ag-multi-file-label-template-populate-label: |-
    Title-case values as [FinalInput]. Copy the template as [FilledLabel], populate the three placeholders, and output only the copy.
  ag-trace-the-expanded-procedure: |-
    Resolve the child at Run, bind input and template, then load data. Group the placeholder mappings under the population operation; return only the filled label.
  ag-sequential-child-calls: |-
    Run the writer before either reader; fill a separate report template with both counts. Resolve paths from SKILL.txt.
  ag-multi-file-word-list-entry: |-
    Writer imports source and destination. Both counters import only the saved path. Parent runs children in order and fills the report.
  ag-multi-file-word-list-words: |-
    Supply comma-separated words.
  ag-multi-file-word-list-save-list: |-
    Parse commas, trim each word, and write one word per line as peer steps.
  ag-multi-file-word-list-count-list: |-
    Count nonempty lines in the saved file.
  ag-multi-file-word-list-count-edible: |-
    Count entries naming foods in the saved file.
  ag-multi-file-word-list-count-template: |-
    Template placeholders: <total> and <edible-total>.
  ag-multi-file-word-list-walkthrough: |-
    Write once, read for both counts, and output only the populated report. Reference child counts directly; aliases are optional.
