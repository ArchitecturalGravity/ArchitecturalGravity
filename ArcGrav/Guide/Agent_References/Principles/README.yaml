sections:
  ag-arcgrav-design-principles: |-
    Design clear, compact, reusable, deterministic, auditable ArcGrav workflows.
    - Notation: [Syntax](../../Syntax/)
    - Reusable structures: [Patterns](../../Patterns/README.md)
    - Wording: [Lexical Representation](../../Principles/Lexical_Representation.md) and [Grammatical Reduction](../../Principles/Grammatical_Reduction.md)
    - File boundaries: [Multi-File Composition](../../Principles/Multi_File_Composition.md#ag-using-multiple-arcgrav-instruction-files)
  ag-purpose: |-
    Maximize signal density, not compression alone. State material inputs and authority, scope and goals, assumptions and constraints, data and state shapes, operations and order, success and failure, uncertainty and conflicts, validation and publication. Keep the smallest precise, interpretable, operational, verifiable representation.
  ag-maximize-signal-density: |-
    Remove repetition that adds no meaning. Keep authority, scope, intent, dependencies, constraints, failure behavior, and verification explicit.
  ag-make-governing-context-explicit: |-
    State boundaries and decision criteria. Distinguish facts, assumptions, goals, constraints, and success conditions. Rank governing policy, task constraints, local conventions, and general practice where precedence matters.
  ag-separate-retrieval-framing-refinement-and-execution: |-
    Separate retrieved data, interpretive framing, output refinement, and execution. Labels can vary; responsibilities must stay distinct.
  ag-prefer-explicit-operations: |-
    Use explicit operations to transform, filter, compare, resolve, validate, or generate. Use static definitions for static context.
  ag-give-each-component-one-dominant-responsibility: |-
    Give each component one coherent responsibility. Split when parts change independently, serve different consumers, require different permissions or validation, or can be reused separately.
  ag-define-before-reference: |-
    Define symbols before use. Preserve their meanings. Avoid forward references, silent redefinition, and overloading.
  ag-prefer-composition-over-duplication: |-
    Compose or reference authoritative components rather than copying them. This reduces repetition and drift and permits independent change.
  ag-prefer-semantic-references-over-embedded-summaries: |-
    Reference complete authoritative context. State only local additions, specializations, or exceptions. Resolve the reference before depending on it; partial copies can omit constraints, lose provenance, or become stale.
  ag-require-a-distinct-contribution: |-
    Keep components that supply required information, authority, provenance, a dependency, a transformation, or independent verification. Check whether each is used, inherited, redundant, or independently required.
  ag-use-the-smallest-sufficient-context: |-
    Cut unrelated history, duplicate summaries, unused examples, speculative resources, and optional context that cannot affect the result. Sufficiency governs compression.
  ag-place-information-at-the-narrowest-valid-scope: |-
    Define broad rules once and inherit them. Place specialized rules nearest their use. Raise a rule only if valid for every affected descendant. Local specializations cannot silently weaken higher-authority rules.
  ag-choose-structures-by-semantic-need: |-
    Choose structure by meaning, not style:
    - Lists: unordered for membership, ordered for sequence, priority for precedence
    - Hierarchy for containment/inheritance, map for keyed relationships, registry for discovery, route for ordered context or execution
    - Template for fixed output shape, queue/worklist for pending work, canonical model/signature for stable comparison
  ag-declare-component-dependencies: |-
    Declare, supply, and validate required bindings before execution. Separate logical dependencies from resource locations. Report missing or incompatible dependencies as integration failures.
  ag-design-for-extension: |-
    Extend through stable contracts, not hardcoded implementation lists. Preserve testability, deterministic ordering, validation ownership, and failure handling.
  ag-separate-configuration-state-operations-validation-and-rendering: |-
    Keep stable configuration, mutable state, transformations, verification, and presentation independently understandable, reusable, replaceable, and testable.
  ag-define-models-before-operations: |-
    Define exchanged records before their operations. Distinguish required, optional, nullable, unresolved, invalid, and derived fields. Preserve exact structural identifiers with backticks and exact text with double quotes.
  ag-keep-canonical-models-separate-from-derived-views: |-
    Maintain one authoritative model. Derive summaries, indexes, registries, reports, and other views rather than maintaining duplicate values.
  ag-separate-comparison-forms-from-source-records: |-
    Canonicalize values for stable comparison, grouping, or deduplication. Retain original records and metadata for output and verification. A comparison signature does not replace its source.
  ag-keep-mutable-state-explicit: |-
    Name mutable state and distinguish it from stable policies, models, contracts, and operations.
  ag-make-state-lifecycles-explicit: |-
    Specify when work initializes, populates, transforms, validates, consumes, and resets or discards state. Do not leave repeat runs exposed to stale state.
  ag-use-explicit-execution-phases: |-
    Separate ordered stages by their inputs, outputs, responsibilities, and failure boundaries. Keep intermediate representations when they improve validation, replay, debugging, recovery, or traceability.
  ag-define-traversal-and-selection-policy: |-
    Define next-item selection, progress, termination, duplicate and cycle handling, treatment of completed items, and resumability. Use a worklist when ordering, observability, priority, or recovery matters.
  ag-make-contracts-explicit: |-
    Specify important inputs, outputs, invariants, side effects, and failure behavior. Distinguish invalid input from valid input with an unresolved result.
  ag-preserve-evidence-and-provenance: |-
    Trace conclusions to original records and transformations. Retain relevant source identity, location, version, excerpt, validator, authority or confidence, and run identity or time. Keep the record supporting a selection.
  ag-preserve-uncertainty-instead-of-inventing-resolution: |-
    Distinguish unknown, absent, empty, false, invalid, conflicting, and not applicable. Keep available and missing evidence plus failure reasons. A deterministic result can be unresolved.
  ag-resolve-conflicts-by-declared-authority: |-
    Rank evidence sources before resolving conflicts. Select only when authority or evidence supports it. For material conflicts among equals, retain competing claims and records and state what would resolve them. Lower authority cannot silently break the tie.
  ag-separate-modification-from-verification: |-
    Separate modification from independent inspection. Report defects without repairing them unless verification explicitly includes repair.
  ag-validate-in-focused-layers: |-
    Use focused schema, reference, semantic, consistency, or postcondition checks as needed. Keep each within its remit and order by prerequisites.
  ag-fail-fast-on-invalid-structure: |-
    Stop when a structural or contractual error makes further work untrustworthy. Report condition, affected input, stopped operation, whether partial state is safe to inspect, and possible retry or remedy. Do not fail fast on ordinary uncertainty the workflow preserves.
  ag-verify-closure-against-the-original-task: |-
    Check closure against original scope, goals, constraints, and success criteria, not just intermediate state. Before publication verify outputs, coverage, references, constraints, blocking uncertainties, completed validation, and accurate partial status.
  ag-design-for-stable-determinism: |-
    With identical inputs/configuration, stabilize ordering, grouping, tie-breaks, traversal, keys, missing values, formatting, separators, and fallbacks across success, unresolved, partial, and error outcomes.
  ag-prefer-minimal-and-idempotent-changes: |-
    Make only necessary changes; preserve valid content and stable order without duplicates. Repeating maintenance must yield no changes; otherwise the postcondition failed.
  ag-make-execution-observable-when-it-matters: |-
    When measurement matters, report structured counts/status separately from findings. Use stable definitions, distinguish attempted/completed/skipped/unresolved/failed, and claim completeness only with coverage evidence.
  ag-cross-model-portability: |-
    Prefer familiar headings, lists, indentation, references, literal blocks, and operators across model interfaces. Avoid reliance on specialized parsers or enforcement for interpretation.
  ag-avoid-unnecessary-structure: |-
    Add structure only when it improves precision, reuse, traceability, determinism, maintainability, safety, validation, recovery, or token use. A small task may need only retrieval, framing, and execution. Add structure incrementally as responsibilities, dependencies, and risks grow.
