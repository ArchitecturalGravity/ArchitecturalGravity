sections:
  ag-architectural-gravity-arcgrav: |-
    ArcGrav is a cross-model Agent Control Language for structuring and operating on context in prompts, from single prompts to modular workflows. Efficiency, retention, consistency, and throughput are design goals.
  ag-what-differentiates-arcgrav: |-
    Use familiar natural language and technical notation. ArcGrav requires no dedicated compiler, parser, schema, runtime, package, or integration; cross-model and framework portability are design goals.
  ag-agent-control-language-vs-agent-framework: |-
    Frameworks execute workflow controls outside the model. ArcGrav supplies instructions the model interprets. Enforce permissions, transactions, persistence, resources, and side effects in the runtime.
  ag-agent-framework-langgraph-crewai-microsoft-agent-framework-etc: |-
    The framework runs the model and enforces state, routing, retries, persistence, and termination.
  ag-agent-control-language-arcgrav: |-
    The model follows the workflow instructions. External guarantees remain the runtime’s responsibility.
  ag-guide: |-
    Use the Guide for principles, syntax, patterns, and examples.
  ag-fundamentals: |-
    Separate input grounding, interpretation, optional output refinement, and execution.
  ag-section-types: |-
    Retrieval grounds inputs. Framing governs interpretation. Refinement shapes output when needed. Execution specifies actions.
  ag-retrieval-input-grounding: |-
    Identify concrete inputs and the task’s scope.
  ag-framing-interpretation-layer: |-
    Specify how to interpret and reason about inputs.
  ag-refinement-output-control-optional: |-
    Add optional output constraints not captured elsewhere.
  ag-execution-operator-selection: |-
    Specify the actions or operations to perform.
  ag-section-ordering: |-
    Order retrieval before framing and optional refinement, then execution.
  ag-contract: |-
    Prefer at least one retrieval, framing, and execution section. Add retrieval, framing, and refinement sections as needed. Usually use one execution section.
  ag-syntax: |-
    Use Key: for sections, - for items, 1. for sequence, P0. for priority, and indentation for hierarchy. Backticks mark exact structural identifiers, double quotes exact text, triple quotes bounded literals. Define [Name] before use. Use => for operations, ↳ for explicit child binding, * for scoped matching, and AS [Alias] for immediately preceding context.
  ag-why-this-works: |-
    Familiar structural cues are intended to reduce interpretive burden; this does not establish universal performance.
  ag-research: |-
    See the research anchor for grounding, contextual retrieval, and prompt compression.
