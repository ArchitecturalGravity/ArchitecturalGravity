sections:
  ag-wildcarding: |-
    `*` selects values matching a scoped path, filename, pattern, or context set.
  ag-purpose: |-
    Compress predictable membership without hiding selection criteria.
  ag-rules: |-
    Match any sequence of characters or values within the stated scope; require the literal surrounding text. State recursion when depth is unclear. Apply the same instruction to every match unless exceptions are explicit.
  ag-constraints: |-
    Bound broad patterns and state exclusions. Do not assume shell glob semantics without a named environment. Anchor reused sets. Quote literal source containing `*` rather than treating it as a selector.
  ag-wildcard-selection: |-
    `tests/*Service.test.ts` selects a filename family.
  ag-extension-family: |-
    Use a suffix pattern such as `*.json` within the chosen scope.
  ag-name-pattern-family: |-
    `AGENTS.route.*.md` preserves required name fragments.
  ag-bounded-wildcard: |-
    Name the root or traversal boundary separately from the pattern.
  ag-wildcard-with-exclusions: |-
    Use an explicit `Exclude:` section for unwanted matching paths.
