sections:
  ag-literal-quote-block: |-
    Standalone paired quote runs of at least three double quotes preserve multiline source as one bounded value, not prompt instructions.
  ag-purpose: |-
    Preserve source text, whitespace, and formatting beneath a named context when needed.
  ag-rules: |-
    Put matching N-quote delimiters on their own lines. N must exceed every standalone quote run inside; shorter runs remain literal. Preserve meaningful indentation and line breaks. Surrounding instructions govern use of the block.
  ag-constraints: |-
    Use inline quotes for short single-line text. Use separate blocks for unrelated sources. Never infer trust or execution from quoting; specify review, transformation, or execution explicitly.
  ag-quoted-scalar: |-
    "complete" fixes exact single-line text.
  ag-literal-source-block: |-
    [Log]:
    """
    ERROR
    RETRY
    """
  ag-literal-source-block-members: |-
    Use a separate fenced value under each exact backticked member.
  ag-code-block-source: |-
    Keep code formatting inside the fence and the instruction outside.
  ag-embedded-example: |-
    Bind an exact exemplar as source another operation can inspect or imitate.
  ag-placeholder-template: |-
    Fence the template shape and retain placeholders such as <summary>.
  ag-literal-comparison-target: |-
    Fence the expected value for a direct comparison.
  ag-nested-literal-block: |-
    Use four quotes around source with triple-quote delimiters; increase length for longer standalone runs.
