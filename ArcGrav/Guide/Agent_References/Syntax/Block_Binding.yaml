sections:
  ag-explicit-block-binding: |-
    A trailing space plus `↳` binds indented children to the entire statement or operation when `:` would obscure ownership.
  ag-purpose: |-
    Bind the whole expression without attaching children to its final reference.
  ag-edge-case: |-
    Scope the child to planning, not to the trailing reference.

    => Plan under [Constraint] ↳
      - List only the necessary changes
  ag-rules: |-
    End the complete parent expression with ` ↳`. Indent children two spaces and apply ordinary nearest-parent binding within the block. A trailing reference remains an invocation, not a declaration or extension.
  ag-constraints: |-
    Use only for actual scope ambiguity. Keep children below the parent, never aligned with it. Prefer ordinary `:` grouping otherwise.
  ag-operation-ending-in-a-reference: |-
    => Plan under [Constraint] ↳
      - Preserve the API
  ag-nested-conditional-under-a-complete-operation: |-
    Indent a conditional operation below the completed `↳` parent; indent its own children another two spaces.

    => Identify next eligible incomplete items in [Roadmap] ↳
      => If no eligible items:
        - Append "NO ELIGIBLE" to [Plan] and return
  ag-prefer-normal-grouping-when-unambiguous: |-
    Use `:` for an unambiguous parent.

    Constraint:
    - API:
      - Preserve response shape
