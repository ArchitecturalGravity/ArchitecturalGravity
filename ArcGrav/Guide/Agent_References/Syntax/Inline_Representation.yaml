  fingerprint: fnv1a32-175ad941
sections:
  ag-inline-representation: |-
    Exactness is local: bare content is interpreted; `name` fixes a structural identifier; "text" fixes a textual value.
  ag-purpose: |-
    Choose representation by semantic role, not spelling. Preserve exact names and values without literalizing the surrounding instruction.
  ag-rules: |-
    Use whitespace-free backticks for exact unqualified fields, keys, members, columns, variables, or parameters. Use `[Name].member` without backticks to fix ownership. Double-quote exact text. Bare resemblance does not imply exactness. Preserve exact identity across uses; other ArcGrav syntax still applies. Marking alone does not read, resolve, execute, mutate, or transform.
  ag-constraints: |-
    Do not use backticks for emphasis, prose, textual values, or human-readable labels with whitespace. Do not quote structural names with double quotes. Use a literal quote block for multiline source.
  ag-interpreted-instruction: |-
    Leave contextually interpreted instructions bare.
  ag-field-assignment: |-
    => Set `status` to "complete"
  ag-partial-exactitude: |-
    In "set `status` to the resolved value", only the field is exact.
  ag-structural-projection: |-
    Project the exact member `name` from [Results].
  ag-structural-comparison: |-
    Compare exact identifiers such as `sourceId` and `targetId`.
  ag-textual-comparison: |-
    Match `status` against the exact text "pending review".
  ag-textual-label: |-
    "Display Name" is text; `displayName` is structure.
  ag-same-lexeme-in-different-roles: |-
    status `status` "status"
  ag-mixed-interpretation-and-exactitude: |-
    Combine bare instruction, exact field `accountId`, and exact message "No matching record" as needed.
  ag-quoted-scalar-vs-literal-source: |-
    Use "Connection refused" for exact inline text; use fenced literal blocks under backticked members for multiline sources.
