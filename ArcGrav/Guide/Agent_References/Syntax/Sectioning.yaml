  url: ../../Syntax/Sectioning.md
  fingerprint: fnv1a32-0871eaba
sections:
  ag-sectioning: |-
    A descriptive `Key:` header bounds child context by semantic role.
  ag-purpose: |-
    Separate retrieval, framing, optional refinement, and execution.
  ag-section-verbiage: |-
    These labels describe roles, not reserved words. Prefer a clear single-word header.
  ag-retrieval: |-
    Retrieval sets scope or names a resource, e.g. `Scope:`.
  ag-framing: |-
    Framing supplies observations or facts, e.g. `Context:`.
  ag-refinement-optional: |-
    Optional refinement states constraints, assumptions, or unknowns.
  ag-execution: |-
    Execution requests an action or answer, e.g. `Task:`.
  ag-rules: |-
    Bind children to the nearest preceding header at their section level. Put child values on following lines; indent nested children two spaces. Use one clear role per section; separate source, constraints, and action where practical.
  ag-constraints: |-
    Omit empty, vague, decorative, redundant, or mixed-purpose sections.
  ag-role-ordered-frame: |-
    Ground before interpreting; interpret and constrain before executing.
  ag-sectioned-context: |-
    Use a descriptive header such as `Constraint:` for one bounded concern.

    [Source]: docs/README.md
    Scope:
    - Docs:
      - [Source]
    Context:
    - The guide explains local setup
    Constraint:
    - Do not edit files
    Task:
    1. Read [Source]
    2. List the setup prerequisites
  ag-scalar-section: |-
    For one scalar, use `Scope: C:\Project` without a child list.
  ag-capability-invocation: |-
    `Using:` names the governing skill, tool, or capability.

    Using:
    - $browser-skill
  ag-completion-hook: |-
    `OnComplete:` scopes work after the primary task.

    OnComplete:
    1. Update related references
    2. Run [Orchestration]
  ag-phase-labeled-work: |-
    Name modifying and verifying as separate phases when they serve different roles.

    ModifyComponentContext:
    - Update the component
    VerifyComponentContext:
    - Confirm output shape
