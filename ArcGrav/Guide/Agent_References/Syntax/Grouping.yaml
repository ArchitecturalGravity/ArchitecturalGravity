  url: ../../Syntax/Grouping.md
  fingerprint: fnv1a32-75ab6389
sections:
  ag-grouping: |-
    Indentation binds child context to the nearest preceding parent item or section. Aligned items are peers; nested items qualify, expand, or operate within parent scope. Hierarchy conveys relationships without repeated prose.
  ag-purpose: |-
    Express parent-child relationships, nested scope, and readable context trees.
    **Canonical example**
    Key:
    - Parent:
      - Child one
      - Child two
    - Peer value
  ag-rules: |-
    Root section items align with their header; each deeper nesting level adds two spaces. Children bind to the nearest preceding item at the previous indentation level; items at the same level are siblings. Maintain consistent peer alignment. Use a trailing `:` for items primarily containing children. Nest only when the child qualifies or belongs to its parent.
  ag-constraints: |-
    Avoid decorative or semantically unnecessary nesting, tabs, ambiguous multiple-parent attachment, and excessive depth when symbolic references would be clearer. Flatten groups whose hierarchy adds no meaning.
  ag-nested-grouping: |-
    Group resources under their containing scopes (e.g., services under a backend). Numbered members may have nested properties; priority items such as `P0.` and `P1.` may be scoped under distinct constraint categories. Each child remains bound to its own parent.
  ag-contract-block: |-
    Group an operation's inputs, outputs, invariants, side effects, and failure behavior under one contract, keeping each concern distinct.
  ag-explicit-uncertainty-record: |-
    Keep unresolved field identity, reason, available evidence, and status together. Example fields: `field`, `reason`, `availableEvidence` (nested evidence list), `status` (e.g., "unresolved").
  ag-evidence-carrying-record: |-
    Keep a conclusion with its provenance: example fields `claim`, `source`, `location`, and `validator`.
  ag-result-sidecar: |-
    Group the domain `artifact` beside separate operational `executionStats`, with `processed`, `resolved`, and `unresolved` nested within the statistics.
  ag-model-variant: |-
    Group shared fields separately from variant-specific fields. Example: root and leaf models both apply shared fields; a root has `parent`: null while a leaf has `children`: [].
