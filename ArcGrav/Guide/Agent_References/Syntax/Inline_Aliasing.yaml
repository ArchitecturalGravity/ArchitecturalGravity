sections:
  ag-inline-aliasing: |-
    `expression AS [Alias]` declares a reusable symbol for the immediately preceding context. Only this declaration form can instantiate inside a symbol body.
  ag-purpose: |-
    Name intermediate observations or results that a later step reuses.
  ag-rules: |-
    Use a bracketed PascalCase identifier without whitespace. Bind one identifiable preceding expression to one symbol. Reference it only afterward; a second `AS [Alias]` duplicates the declaration.
  ag-constraints: |-
    Every alias needs a subsequent reference. Do not put `AS` before its source or use it as ambiguous prose. Prefer a direct declaration when no immediate expression supplies the context. Name the alias specifically.
  ag-transformation-alias: |-
    `Parse [Source] AS [Parsed]`; reuse `[Parsed]` in the next stage.
  ag-boolean-alias: |-
    `Determine whether [Goal] is supported AS [Fulfillable]`.
  ag-candidate-alias: |-
    `Collect matching records AS [Candidates]`.
  ag-filtered-alias: |-
    `Filter [Records] AS [ValidRecords]`.
  ag-comparison-alias: |-
    `Canonicalize [Candidate] AS [Signature]`.
  ag-immediate-binding-rule: |-
    Bind only the immediately preceding expression, not earlier context.
