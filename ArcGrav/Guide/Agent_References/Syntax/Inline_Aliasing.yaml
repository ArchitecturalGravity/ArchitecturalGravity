sections:
  ag-inline-aliasing: |-
    `expression AS [Alias]` declares a reusable symbol for the immediately preceding context. Only this declaration form can instantiate inside a symbol body.
  ag-purpose: |-
    Name intermediate observations or results that a later step reuses.
  ag-rules: |-
    Use a bracketed PascalCase identifier without whitespace. Bind one identifiable preceding expression to one symbol. Reference it only afterward; a second `AS [Alias]` duplicates the declaration.
  ag-constraints: |-
    Every alias needs a subsequent reference. Do not put `AS` before its source or use it as ambiguous prose. Prefer a direct declaration when no immediate expression supplies the context. Name the alias specifically.
  ag-transformation-alias: |-
    Name an intermediate result and reuse it.

    Scope: Work within the example data

    [Source]: sample.txt

    Task:
    1. Parse [Source] AS [Parsed]
    2. Validate [Parsed]
  ag-boolean-alias: |-
    Name a condition and use it to govern later work.

    Task:
    1. Determine feasibility AS [Fulfillable]
    2. If [Fulfillable], proceed
  ag-candidate-alias: |-
    Capture discovered values for later resolution.

    Task:
    1. Collect matching records AS [Candidates]
    2. Resolve [Candidates]
  ag-filtered-alias: |-
    Name the subset produced by filtering.

    Scope: Work within the example data

    [Records]: records.csv

    Task:
    1. Remove invalid records from [Records] AS [ValidRecords]
    2. Return [ValidRecords]
  ag-comparison-alias: |-
    Name a canonical representation for comparison.

    Scope: Work within the example data

    [Candidate]: Candidate record

    [Expected]: Expected record shape

    Task:
    1. Canonicalize [Candidate] AS [Signature]
    2. Compare [Signature] with [Expected]
  ag-immediate-binding-rule: |-
    Bind only the immediately preceding expression, not earlier context.

    Task:
    1. Extract records AS [Records]
    2. Evaluate [Records]
