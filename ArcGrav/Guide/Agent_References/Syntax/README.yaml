sections:
  ag-arcgrav-syntax-reference: |-
    ArcGrav syntax reference for structuring, referencing, and operating on context.
  ag-sectioning: |-
    `Key:` scopes context by role.
  ag-listing: |-
    `-` marks membership, `1.` sequence, and `P0.` precedence.
  ag-grouping: |-
    Indentation binds children to parents.
  ag-symbolic-referencing: |-
    `[Target]:` declares an anchor; `[Target]` reuses it.
  ag-context-operation: |-
    `=>` directs an operation rather than listing context.
  ag-inline-representation: |-
    Bare content is interpreted; backticks fix structural names; double quotes fix text.
  ag-literal-quote-block: |-
    Standalone runs of at least three double quotes bound literal source.
  ag-explicit-block-binding: |-
    Trailing ` ↳` binds children to the entire expression when `:` would be ambiguous.
  ag-inline-aliasing: |-
    `AS [Alias]` names the immediately preceding context.
  ag-wildcarding: |-
    `*` selects matches within the stated scope.
