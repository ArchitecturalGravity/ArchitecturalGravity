sections:
  ag-arcgrav-syntax-reference: |-
    ArcGrav syntax reference for structuring, referencing, and operating on context.
  ag-sectioning: |-
    [Sectioning](./Sectioning.yaml): `Key:` scopes context by role.
  ag-listing: |-
    [Listing](./Listing.yaml): `-` marks membership, `1.` sequence, and `P0.` precedence.
  ag-grouping: |-
    [Grouping](./Grouping.yaml): Indentation binds children to parents.
  ag-symbolic-referencing: |-
    [Symbolic Referencing](./Symbolic_Referencing.yaml): `[Target]:` declares an anchor; `[Target]` reuses it.
  ag-context-operation: |-
    [Context Operation](./Context_Operation.yaml): `=>` directs an operation rather than listing context.
  ag-inline-representation: |-
    [Inline Representation](./Inline_Representation.yaml): Bare content is interpreted; backticks fix structural names; double quotes fix text.
  ag-literal-quote-block: |-
    [Literal Quote Block](./Literal_Quote_Block.yaml): Standalone runs of at least three double quotes bound literal source.
  ag-explicit-block-binding: |-
    [Explicit Block Binding](./Block_Binding.yaml): Trailing ` ↳` binds children to the entire expression when `:` would be ambiguous.
  ag-inline-aliasing: |-
    [Inline Aliasing](./Inline_Aliasing.yaml): `AS [Alias]` names the immediately preceding context.
  ag-wildcarding: |-
    [Wildcarding](./Wildcarding.yaml): `*` selects matches within the stated scope.
