sections:
  ag-process-orchestration: |-
    Determine when operations run, not what they mean: split, assign, order, dispatch, parallelize, iterate, recover, and stop.
  ag-workflow-management-phase-oriented-workflow: |-
    Name workflow phases and their entry/exit conditions: discover, derive, render, validate, publish.
  ag-task-decomposition-atomic-task-split: |-
    Split [Goal] into independently verifiable work items (e.g., source resolution, extraction, classification, rendering, coverage).
  ag-recursive-traversal-hierarchy-walk: |-
    Walk nested resources preserving parent-child context; declare include/exclude rules (Markdown under /Patterns/, no generated directories).
  ag-worklists-and-queues-explicit-pending-set: |-
    Keep a visible pending queue for interruptible work (unresolved resources, unclassified patterns, unrendered categories).
  ag-dependency-ordering-topological-work-order: |-
    Build the task dependency graph; execute ready prerequisites before dependents.
  ag-routing-and-dispatch-capability-based-routing: |-
    Route by capability: file retrieval for reads, create/update for writes, model reasoning for semantic grouping.
  ag-conditional-execution-branch-on-evidence: |-
    Make evidence and actions explicit: IF the target exists, update it; ELSE create it.
  ag-conditional-dispatch-condition-based-selection: |-
    Map each defined condition directly to its action. Use an unordered list for mutually exclusive or otherwise explicit cases; order it when precedence matters. Bind conditions and actions to symbolic references when useful.
    [Switch]:
    - [Value] is positive:
      => Run [Positive]
  ag-sequential-execution-dependency-sequence: |-
    Use an ordered list when later steps consume prior results: resolve [Files], parse as [Parsed], classify as [Derived], then render [Derived].
  ag-parallel-execution-independent-work-set: |-
    Run independent tasks concurrently and isolate their outputs.
  ag-iteration-bounded-refinement-loop: |-
    Iterate with an explicit bound and progress test: for up to three iterations, validate and fix only failed assertions; stop when all pass.
  ag-retry-and-recovery-bounded-retry: |-
    Retry only transient or independent failures within a bound (e.g., one write retry after refreshing target state); preserve successes and record persistent failures.
  ag-replay-plans-deterministic-re-execution: |-
    Record source paths, taxonomy, ordered transformations, output paths, and validation assertions for deterministic replay.
  ag-termination-conditions-explicit-stop-contract: |-
    Stop successfully when postconditions pass; stop with partial results when no work is ready; never loop on unchanged state.
  ag-maintenance-convergence-minimal-idempotent-update: |-
    Inspect current state, apply the smallest deterministic changes, preserve valid content, and verify. Repeat against the result and confirm no further changes.
  ag-workflow-extension-replaceable-strategy-pipeline: |-
    Route through stable discovery, transformation, validation, and publication stages; replace one strategy without changing unrelated stages.
  ag-composite-pattern-orchestrated-work-graph: |-
    Split the goal and build dependencies; run independent ready work in parallel and dependent work in order. Bound transient retries, validate each phase, and stop at postconditions or no progress.
