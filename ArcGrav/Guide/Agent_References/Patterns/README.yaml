sections:
  ag-arcgrav-design-pattern-catalogue: |-
    Reusable ArcGrav patterns organized by operational responsibility.
  ag-contextual-boundary: |-
    Set scope, objectives, assumptions, success criteria, audience, and governing instructions.
  ag-resource-discovery: |-
    Identify and retrieve verified files, tools, history, memory, URLs, and external sources.
  ag-representation-shaping: |-
    Shape stable schemas, models, templates, and views for reasoning, reuse, validation, and publication.
  ag-state-management: |-
    Track changing context, variables, dependencies, checkpoints, and cleanup across steps.
  ag-constraint-gating: |-
    Check policies, safety, business rules, and execution conditions before allowing operations.
  ag-transformation: |-
    Parse, extract, classify, analyze, synthesize, or plan from source material.
  ag-context-integration: |-
    Combine retrieved, remembered, derived, and tool-produced context; retain sources, dependencies, and unresolved conflicts.
  ag-examination: |-
    Check evidence, structures, and outputs for correctness, completeness, quality, and acceptability.
  ag-process-orchestration: |-
    Decompose, route, sequence, parallelize, iterate, recover, and terminate work.
  ag-resolution: |-
    Resolve supported conflicts, preserve uncertainty, record decisions and provenance, verify closure, and produce a defensible result.
