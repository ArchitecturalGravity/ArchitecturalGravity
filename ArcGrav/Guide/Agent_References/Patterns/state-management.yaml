sections:
  ag-state-management: |-
    Own and track changing values, decisions, dependencies, progress, checkpoints, blockers, and temporary context; define validity, transitions, lifecycle, and cleanup without dictating sequence.
  ag-session-state-session-bounded-configuration: |-
    Store task-wide settings (repository, branch, target) as session-bounded, not permanent.
  ag-conversation-state-turn-state-summary: |-
    Summarize the turn in decisions, active constraints, and open items.
  ag-working-variables-named-mutable-values: |-
    Give changing values a symbolic name, e.g., [PendingFiles]; update that name rather than creating competing aliases.
  ag-mutable-state-explicit-transition: |-
    State transitions with before/after conditions, e.g., [Remaining] = [Requested] minus [Completed].
  ag-dependency-state-readiness-map: |-
    Track task readiness explicitly: blocked (with dependency), ready, running, or complete.
  ag-state-lifecycle-initialize-use-retire: |-
    Initialize named state, use it through publication, then retire temporary state such as extraction notes.
  ag-checkpoints-recoverable-snapshot: |-
    Capture a recoverable snapshot after meaningful stages: resolved resources, completed mappings, and whether writes have started.
  ag-cleanup-and-reset-behavior-explicit-disposal: |-
    Define reset/disposal after success or failure; remove temporary aliases, not source files, published outputs, or provenance.
  ag-composite-pattern-stateful-work-ledger: |-
    Use one [State] ledger for `phase`, `completed`, `pending`, and `blockers`: run the next ready item, record completion, update phase and blockers, then checkpoint after each publication stage.
