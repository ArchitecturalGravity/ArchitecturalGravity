sections:
  ag-transformation: |-
    Derive meaning from supplied context via declared operations; do not retrieve sources, integrate independent results or validate correctness here.
  ag-parsing-structure-recovery: |-
    [Parsed]: Recover explicit headings, lists, references and operations from raw [Source] before interpretation.
  ag-extraction-relevant-field-extraction: |-
    [Extracted]: From [Source], keep only objective-relevant fields and source identity (e.g. name, intent, mechanics, constraints, example).
  ag-filtering-relevance-filter: |-
    [Filtered]: Apply inclusion criteria (e.g. keep reusable prompt-operation patterns, exclude repo history and incidental prose).
  ag-normalization-surface-normalization: |-
    [Normalized]: Standardize spelling, headings, identifiers and list structure without semantic change (e.g. category title case, file kebab-case).
  ag-canonicalization-semantic-equivalence-collapse: |-
    [Canonical]: Merge variants with equivalent intent and mechanics; keep clearest example and all unique constraints.
  ag-classification-primary-category-assignment: |-
    [Classified]: Assign [Extracted] to [Categories] by dominant function; keep useful secondary tags.
  ag-aggregation-category-aggregation: |-
    [Grouped]: Aggregate [Canonical] by primary category; sort by conceptual dependency.
  ag-analysis-mechanism-analysis: |-
    [Analysis]: Relate syntax to interpretation: identify cue, binding rule, expected behavior and failure mode.
  ag-synthesis-evidence-bounded-synthesis: |-
    [Pattern]: Synthesize multiple [Evidence] observations into intent, procedure, invariant and example; invent no unsupported mechanics.
  ag-candidate-generation-bounded-candidate-set: |-
    [Candidates]: Generate distinct options under the same [Constraints] (e.g. three); retain tradeoffs and pass to examination.
  ag-comparison-dimensioned-comparison: |-
    [Comparison]: Compare [Candidates] on explicit dimensions (e.g. precision, reuse, token cost, failure risk).
  ag-planning-dependency-aware-plan: |-
    [Plan]: Decompose [Goal] under constraints, order executable steps by dependency, and mark validation and termination conditions.
  ag-translation-meaning-preserving-translation: |-
    [Translated]: Translate [Source] prose while preserving hierarchy and behavior; retain references, symbols, paths, code and schema keys literally.
  ag-composite-pattern-transformation-chain: |-
    [Derived]: Parse [Existing], extract reusable mechanisms, normalize terminology, canonicalize equivalents, classify by [Categories], aggregate and synthesize entries. Keep semantic changes distinct from publication.
