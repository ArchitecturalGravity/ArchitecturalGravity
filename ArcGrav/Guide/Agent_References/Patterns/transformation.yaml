sections:
  ag-transformation: |-
    Derive meaning from supplied context. Do not retrieve sources, integrate independent results or validate correctness.
  ag-parsing-structure-recovery: |-
    Recover explicit structure before interpretation.

    Example:
    [Parsed]:
    => Parse [Source] into:
      - Headings
      - Lists
      - References
      - Operations
  ag-extraction-relevant-field-extraction: |-
    Extract only fields relevant to the objective; retain source identity.

    Example:
    [Extracted]:
    => Extract pattern from [Source] ↳
      - Name
      - Intent
      - Constraints
  ag-filtering-relevance-filter: |-
    Apply explicit inclusion and exclusion criteria.

    Example:
    [Filtered]:
    => Keep reusable prompt-operation patterns
    => Exclude repository history and incidental prose
  ag-normalization-surface-normalization: |-
    Standardize spelling, headings, identifiers and lists without changing meaning.

    Example:
    [Normalized]:
    => Normalize category names to canonical title case
    => Normalize file names to kebab-case
  ag-canonicalization-semantic-equivalence-collapse: |-
    Merge equivalent intent/mechanics; keep the clearest example and every unique constraint.

    Example:
    [Canonical]:
    => Merge patterns with equivalent intent and mechanics
    => Retain the clearest example and all unique constraints
  ag-classification-primary-category-assignment: |-
    Classify by dominant function; keep useful secondary tags.

    Example:
    [Classified]:
    => Classify [Extracted] by [Categories]
    => Preserve secondary-category tags when useful
  ag-aggregation-category-aggregation: |-
    Group canonical records by primary category; sort by conceptual dependency.

    Example:
    [Grouped]:
    => Group [Canonical] by primary category
    => Sort by conceptual dependency
  ag-analysis-mechanism-analysis: |-
    Relate syntax to interpretation through cue, binding, behavior and failure.

    Example:
    [Analysis]:
    => Identify:
      - Cue
      - Binding rule
      - Expected behavior
      - Failure mode
  ag-synthesis-evidence-bounded-synthesis: |-
    Abstract from multiple observations without inventing mechanics.

    Example:
    [Pattern]:
    => Synthesize [Evidence] into:
      - Intent
      - Procedure
      - Invariant
      - Example
  ag-candidate-generation-bounded-candidate-set: |-
    Generate distinct candidates under one contract; retain tradeoffs for examination.

    Example:
    [Candidates]:
    => Generate 3 distinct implementations satisfying [Constraints]
    => Preserve tradeoffs for ranking
  ag-comparison-dimensioned-comparison: |-
    Compare on explicit dimensions.

    Example:
    [Comparison]:
    => Compare [Candidates] by:
      - Precision
      - Reuse
      - Token cost
      - Failure risk
  ag-planning-dependency-aware-plan: |-
    Order executable steps by dependency; mark validation and termination.

    Example:
    [Plan]:
    => Decompose [Goal]
    => Order steps by dependency
    => Mark validation and termination conditions
  ag-translation-meaning-preserving-translation: |-
    Translate prose; preserve hierarchy, behavior, references and literals.

    Example:
    [Translated]:
    => Translate prose in [Source]
    => Preserve symbols literally:
      - Paths
      - Code
      - Schema keys
  ag-composite-pattern-transformation-chain: |-
    Expose each semantic transformation; keep derivation distinct from publication.

    Example:
    [Derived]:
    => Parse [Existing] and extract reusable mechanisms
    => Normalize terminology and canonicalize equivalents
    => Classify by [Categories] and aggregate by category
    => Synthesize publishable pattern entries
