sections:
  ag-resource-discovery: |-
    Identify, resolve, retrieve, and prioritize relevant supplied context, history, memory, files, tools, URLs, registries, and external evidence without interpreting or transforming it.
  ag-tool-discovery-capability-enumeration: |-
    Inspect actual read/write tools, required inputs, and limitations before choosing a path; never assume a helpful capability exists.
  ag-external-knowledge-sources-declared-source-set: |-
    Declare approved sources and their roles: official docs for API behavior, repository files for local conventions, user-provided text for requirements.
  ag-conversation-history-relevant-turn-retrieval: |-
    Retrieve only prior turns with applicable constraints, decisions, open questions, or reusable artifacts; exclude superseded proposals.
  ag-working-memory-named-active-context: |-
    Name active facts in a compact [WorkingSet]: current constraints, inspected files, open validation failures.
  ag-session-memory-session-scoped-fact-set: |-
    Retain facts valid across session steps (branch, format, exclusions) without promoting them to permanent assumptions.
  ag-file-and-directory-resolution-resolve-before-read: |-
    Resolve ambiguous file references to canonical repository-relative paths before reading; honor filters such as excluding generated and vendored files.
  ag-url-resolution-url-to-resource-mapping: |-
    Classify a URL before fetching (file, directory, issue, document, registry entry); resolve identifiers such as repository, branch, and path.
  ag-resource-registries-registry-lookup: |-
    Use a named registry to resolve logical identifiers to resource locations rather than guessing paths.
  ag-file-backed-context-indirect-resource-anchor: |-
    Represent a reusable resource by a symbolic anchor, e.g., [ValidationStandard]; resolve and verify it before applying its contents.
  ag-dependency-resolution-resolve-then-bind: |-
    Keep component resolution distinct from binding required and provided context. Resolve [AuditorModule], verify dependencies, bind required inputs, then execute with declared outputs.
  ag-retrieval-rag-query-then-ground: |-
    Retrieve for [Question] before synthesizing; exclude low-relevance material and retain passages with source identifiers and exact locations.
  ag-resource-contribution-distinct-contribution-test: |-
    Retain a resource only if downstream work uses distinct information, authority, provenance, or an independent verification path. Compare with existing context and exclude redundancy.
  ag-composite-pattern-discovery-pipeline: |-
    Declare [Need], discover actual capabilities, resolve files/URLs/registries, retrieve current contents, and preserve canonical paths as [ResolvedResources]. Operate only on that set.
