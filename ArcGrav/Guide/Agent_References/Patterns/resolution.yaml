sections:
  ag-resolution: |-
    Turn examined evidence into a defensible conclusion: rank authority, resolve supported conflicts, preserve ambiguity, record uncertainty and provenance, verify closure, and publish only eligible outputs.
  ag-source-record-preservation-immutable-source-layer: |-
    Keep unmodified [SourceRecords] separate from normalized or derived records.
  ag-evidence-retention-keep-supporting-evidence: |-
    Keep support attached to the outcome through transformation and publication (e.g., classification and evidence for it).
  ag-provenance-source-to-output-trace: |-
    Trace a derived artifact from source through ordered operations to its output path.
  ag-authority-ranking-ranked-evidence-authority: |-
    Rank authority before resolving disputes, from highest to lowest: explicit governing constraints, current authoritative source, repository convention, derived inference, general convention.
  ag-conflict-resolution-rule-guided-conflict-resolution: |-
    Compare competing claims by [Authority]; choose a higher-authority supported claim only when justified, and record the rejected alternative and reason.
  ag-ambiguity-preservation-preserve-material-ambiguity: |-
    Preserve materially different meanings until evidence or the task contract warrants choosing one (e.g., source example vs. reusable pattern).
  ag-uncertainty-representation-calibrated-uncertainty-record: |-
    Record the uncertain `claim`, `confidence`, `cause`, and what would resolve it.
  ag-decision-records-compact-decision-log: |-
    Log consequential `decision`, `alternatives`, and `rationale`.
  ag-independent-verification-separate-verification-path: |-
    Verify final claims independently of derivation (e.g., derive expected paths directly from categories and compare with published paths).
  ag-final-completeness-checks-closure-audit: |-
    Audit closure against the original request, not latest state: coverage, target paths, content, and source restrictions.
  ag-output-publication-validated-publication: |-
    Publish only outputs passing structural and semantic [Acceptance]; retain failures as drafts and report exact unresolved items.
  ag-composite-pattern-evidence-to-publication-resolution: |-
    Rank authorities and resolve supported conflicts; preserve ambiguities and uncertainty, retain evidence and provenance, log decisions, verify closure independently, and publish validated work.
