sections:
  ag-context-integration: |-
    Relate independent context units without transforming or judging them. Preserve source identity, qualifications, dependencies, provenance, and unresolved conflicts.
  ag-component-responsibility-single-responsibility-context-unit: |-
    Give each reusable unit one dominant responsibility. Keep retrieval, transformation, validation, rendering, mutation, and publication replaceable; split when contracts or reasons for change differ.
  ag-dependency-contracts-explicit-context-interface: |-
    Declare the symbolic inputs a component requires and outputs it provides before integration; bind its inputs from [ContextPack].
  ag-memory-reconciliation-current-fact-reconciliation: |-
    Reconcile [SessionFacts] against current authoritative sources; replace stale facts and preserve unresolved conflicts.
  ag-retrieval-fusion-evidence-fusion: |-
    Group retrieved passages by supported claim; deduplicate equivalents but keep all supporting sources.
  ag-tool-result-integration-typed-tool-result-merge: |-
    Normalize paths, identifiers, status, and content from [ToolResults]; separate errors from successful observations.
  ag-representation-composition-compatible-model-composition: |-
    Map compatible fields and identifiers before joining models (e.g., by `categoryId`); retain unmatched records for examination.
  ag-intermediate-result-merging-deterministic-merge: |-
    Union partial results under explicit duplicate/conflict rules: deduplicate by canonical name and route incompatible definitions to [Conflicts].
  ag-context-stitching-boundary-preserving-stitch: |-
    Order fragments by topic and add transitions without crossing scope boundaries; keep source-specific qualifications attached to claims.
  ag-knowledge-consolidation-reusable-knowledge-set: |-
    Consolidate recurring mechanisms in [Evidence] into one stable, reusable abstraction per mechanism.
  ag-context-assembly-ordered-context-pack: |-
    Assemble [ContextPack] in dependency order: boundaries, resolved source facts, current derived state, then task instructions.
  ag-dependency-resolution-dependency-binding: |-
    Select downstream work only after its symbolic or procedural dependencies are satisfied.
  ag-extensible-composition-open-closed-context-set: |-
    Compose [ExpandedValidators] from [Validators] + [FreshnessValidator] rather than mutating [Validators]. Preserve the original set and the consumer's dependency, behavior, and output contracts.
  ag-output-composition-section-aware-composition: |-
    Assemble validated titles, intents, entries, examples, and cautions by section; render only those components, not free-form replacements.
  ag-composite-pattern-integration-pipeline: |-
    Reconcile memory, fuse retrieval, normalize tool results, bind dependencies, merge partials, and consolidate patterns. Compose the result using [OutputSchema] without source loss or silent contradiction.
