sections:
  ag-examination: |-
    Inspect evidence, intermediates, structures or candidates against explicit criteria. Flag defects, omissions, contradictions, unsupported claims, counterexamples and failed checks; leave unresolved conflicts to resolution.
  ag-observation-fact-only-observation: |-
    [Observations]: Record visible headings, references, operations and constraints in [Source]; defer intent inference.
  ag-inspection-targeted-inspection: |-
    [Inspection]: Inspect bounded [Files] for declared defects (e.g. broken links, duplicate headings, empty sections).
  ag-structural-validation-structure-contract-check: |-
    [StructureCheck]: Check required sections, order and nesting (e.g. one H1, entries at H2, fenced examples).
  ag-schema-validation-field-level-validation: |-
    [SchemaCheck]: Validate every [Pattern] against [PatternSchema].
  ag-semantic-validation-meaning-check: |-
    [SemanticCheck]: Compare pattern intent, procedure and example; flag meaning mismatches.
  ag-referential-validation-reference-integrity-check: |-
    [ReferenceCheck]: Resolve every bracketed symbol and repo-relative link uniquely; reject missing or multiply defined targets.
  ag-consistency-and-completeness-cross-artifact-check: |-
    [Coverage]: Check terminology and coverage across outputs: one file per [Category], every requested subcategory present.
  ag-evidence-verification-claim-to-evidence-check: |-
    [EvidenceCheck]: Map each derived pattern to at least one source mechanism; keep source locations when available.
  ag-assertion-checking-explicit-assertion-set: |-
    [Assertions]: Use pass/fail requirements (e.g. category files = 10; empty files = 0; missing index links = 0).
  ag-execution-instrumentation-structured-workflow-metrics: |-
    Publish stable workflow metrics with [Result] from observable events: resources_requested, resources_resolved, records_processed, records_accepted, records_rejected, unresolved_items, validation_failures, postconditions_passed. Expose skipped or unresolved work; claim completeness only with coverage evidence.
  ag-instrumentation-validation-independent-metrics-check: |-
    [MetricsCheck]: Check processed counts against [SourceInventory] and workflow state; reconcile accepted/rejected/unresolved totals, match unresolved records to [Result], and reject unsupported completeness.
  ag-cross-validation-independent-check-path: |-
    [CrossCheck]: Use a second method: compare rendered inventory with [Categories]; independently match index links to actual paths.
  ag-evaluation-criteria-based-evaluation: |-
    [Evaluation]: Judge [Candidate] by named criteria (e.g. precision, completeness, reuse, token cost).
  ag-candidate-ranking-dimensioned-ranking: |-
    [Ranking]: Weight or order criteria; retain tradeoffs (e.g. constraints > source semantics > clarity > simplicity).
  ag-quality-assessment-and-confidence-calibrated-assessment: |-
    [Assessment]: Report quality, confidence and uncertainty separately (e.g. acceptable, 0.86, partial source inventory).
  ag-acceptance-testing-consumer-level-test: |-
    [Acceptance]: Test as consumer: locate each category via index, copy patterns without missing context, check example ArcGrav syntax.
  ag-pass-fail-determination-explicit-verdict: |-
    [Verdict]: After assertions and acceptance tests, PASS only if all P0 assertions pass; otherwise FAIL and list exact unmet assertions. Keep observation, validation, ranking and acceptance distinct.
