sections:
  ag-contextual-boundary: |-
    Define the operating contract (scope, objectives, assumptions, audience, authority, permissions, exclusions, measurable success); enforce it separately.
  ag-scope-enumerated-scope-fence: |-
    Scope: Bound initial context before other instructions (e.g. src/auth/* and tests/auth/*, excluding deployment config). No work outside scope without explicit expansion in the prompt.
  ag-authority-and-precedence-ranked-instruction-sources: |-
    [Authority]: Rank competing sources (e.g. P0 safety/repo policy, P1 explicit task constraints, P2 local conventions, P3 best practices). Lower ranks may refine, never override.
  ag-objectives-named-objective-set: |-
    [Objectives]: Name desired outcomes separately from steps (e.g. preserve public behavior, remove duplicated validation, improve diagnostics).
  ag-audience-and-consumers-consumer-specific-output-boundary: |-
    [Audience]: Name the consumer and what they need to decide (e.g. PR maintainers need risks, changed behavior and test evidence).
  ag-assumptions-visible-assumption-ledger: |-
    [Assumptions]: State material, revisable assumptions separately from facts (e.g. UTF-8 inputs; missing fields invalid).
  ag-success-criteria-verifiable-completion-contract: |-
    [Success]: State observable checks (e.g. existing tests pass, new invalid-input coverage, public API signatures unchanged).
  ag-composite-pattern-boundary-contract: |-
    Separate [Target] (manifests, lockfiles, migration tests), [Objectives] (unchanged runtime behavior), [Assumptions] (version approved), [Success] (dependency resolves, tests pass, no unrelated edits), and [Authority] (repo instructions > target/success > style).
