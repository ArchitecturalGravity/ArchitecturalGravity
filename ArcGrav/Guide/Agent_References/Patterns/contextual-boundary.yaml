sections:
  ag-contextual-boundary: |-
    Define the operating contract (scope, objectives, assumptions, audience, authority, permissions, exclusions, measurable success); enforce it separately.
  ag-scope-enumerated-scope-fence: |-
    Scope: Bound initial context before other instructions. No work outside scope without explicit expansion in the prompt.

    Example:
    Scope:
    - src/auth/*
    - tests/auth/*
    - Exclude deployment configuration
  ag-authority-and-precedence-ranked-instruction-sources: |-
    Rank competing sources. Lower ranks may refine, never override.

    Example:
    [Authority]:
    P0. Safety and repository policy
    P1. Explicit task constraints
    P2. Local conventions
    P3. General best practices
  ag-objectives-named-objective-set: |-
    Name desired outcomes separately from steps so alternative plans can be evaluated against the same goal.

    Example:
    [Objectives]:
    - Preserve public behavior
    - Remove duplicated validation
    - Improve failure diagnostics
  ag-audience-and-consumers-consumer-specific-output-boundary: |-
    Name the consumer and what they need to decide.

    Example:
    [Audience]:
    - Maintainers reviewing a pull request
    - Decisions:
      - Need risks
      - Changed behavior
      - Test evidence
  ag-assumptions-visible-assumption-ledger: |-
    State material, revisable assumptions separately from facts.

    Example:
    [Assumptions]:
    - Input files are UTF-8
    - Missing fields are invalid, not optional
  ag-success-criteria-verifiable-completion-contract: |-
    State observable checks.

    Example:
    [Success]:
    - Existing tests pass
    - New invalid-input cases are covered
    - No public API signature changes
  ag-composite-pattern-boundary-contract: |-
    State target, objective, assumptions, observable success and precedence separately.

    Example:
    [Target]:
    - Package manifests
    - Lockfiles
    - Migration tests

    [Objectives]:
    - Migrate without changing runtime behavior

    [Assumptions]:
    - The target version is approved

    [Success]:
    - Dependency resolves
    - Tests pass
    - No unrelated edits

    [Authority]:
    P0. Repository instructions
    P1. [Target] and [Success]
    P2. Existing style
