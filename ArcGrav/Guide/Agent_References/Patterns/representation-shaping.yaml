sections:
  ag-representation-shaping: |-
    Encode, organize, compress, and render meaning in schemas, models, intermediate artifacts, views, and serialized outputs without breaking declared invariants.
  ag-schemas-explicit-shape-contract: |-
    Before producing records, declare required fields, types, optionality, and allowed values (e.g., `category` enum; `confidence` float from 0 to 1).

    [ResultSchema]:
    - `name`: string
    - `category`: enum
    - `evidence`: list
    - `confidence`: float from 0 to 1
  ag-structural-identifiers-exact-name-representation: |-
    Backtick exact members in declarations, references, projections, comparisons, transformations, and mutations; use double quotes for text. This is a convention, not an operator.

    [RecordSchema]:
    - `status`: string

    Task:
    => Set `status` to "complete"
  ag-data-modeling-relationship-first-model: |-
    Model entities and relationships whenever lists hide dependencies: a pattern belongs to a category, may reference another pattern, and is supported by evidence.

    [Model]:
    - Pattern belongs to Category
    - Pattern may reference Pattern
    - Evidence supports Pattern
  ag-canonical-models-one-authoritative-representation: |-
    Normalize equivalent inputs into one authoritative record for downstream use. Selected fields:

    [CanonicalPattern]:
    - `name`
    - `intent`
    - `invariants`
  ag-scoped-inheritance-broad-to-narrow-context-model: |-
    Model explicit parent-child inheritance; put each rule at the narrowest scope where fully valid (repository validation, app integration tests, endpoint response shape).

    [RepositoryContext]:
    - All changes require validation

    [ApplicationContext]:
    - [RepositoryContext]
    - Application changes require integration tests
  ag-canonical-referencing-reference-over-embedded-copy: |-
    Reference authoritative policies, schemas, models, operations, or instructions; add only local rules rather than duplicating part of the authority.

    [SecurityPolicy]:
    - policies/security.md

    [FeatureContext]:
    1. [SecurityPolicy]
    2. Feature-specific constraints only
  ag-context-composition-composite-context-interface: |-
    Expose related context through one stable higher-level anchor.

    [PublicationStandard]:
    - [PatternSchema]
    - [FormattingRules]
    - [ValidationRules]
    - [ProvenanceRules]

    Task:
    - Apply [PublicationStandard]
  ag-intermediate-representations-staged-reasoning-artifact: |-
    Stage reasoning with temporary representations: parse [RawText] into one record per semantic unit, then group parsed items by `category`.

    [ParsedItems]:
    => Parse [RawText]
    => Emit one record per semantic unit

    [GroupedItems]:
    => Group [ParsedItems] by `category`
  ag-model-variants-purpose-specific-variant: |-
    Project variants from the canonical model; do not maintain separate copies.

    [CompactView]:
    => Project `name`, `intent`, and `invariants` from [CanonicalPattern]
  ag-derived-views-reversible-projection: |-
    Filter, aggregate, or sort without losing the link to the canonical source.

    [CategoryIndex]:
    => Group [CanonicalPatterns] by `category`
    => Sort each group by `name`
  ag-output-shaping-consumer-driven-projection: |-
    Project only what the audience needs.

    [PublishedView]:
    => Project [CanonicalPatterns] for guide readers
    => Include `intent`, `mechanics`, `example`, and `cautions`
    => Exclude extraction notes
  ag-templating-stable-document-template: |-
    Keep template structure literal; retain placeholders for caller-supplied content.

    [Template]:
    """
    # <category name>

    ## <pattern name>

    **Intent:** <intent context>

    **Use when:** <usage conditions>

    ```text
    <example usage>
    ```

    # Invariant:
    [InvariantCondition]
    """
  ag-formatting-and-rendering-render-last: |-
    Complete semantic content before rendering; apply output layout then (e.g., Markdown, one H1, fenced prompt notation).

    [Rendered]:
    => Render [PublishedView] as Markdown
    => Use one H1 per file
    => Use fenced blocks for prompt notation
  ag-serialization-declared-encoding: |-
    Declare these rules for stored or tool-consumed output.

    [Serialization]:
    - UTF-8
    - Markdown
    - LF line endings
    - Repository-relative links
  ag-composite-pattern-canonicalize-project-render: |-
    Normalize [Source] to [Schema], derive the audience view, then render using [Template] and serialize by [Serialization]; keep meaning independent of presentation.

    [Canonical]:
    => Normalize [Source] into [Schema]

    [View]:
    => Derive reader-facing fields from [Canonical]

    [Output]:
    => Render [View] using [Template]
    => Serialize by [Serialization]
