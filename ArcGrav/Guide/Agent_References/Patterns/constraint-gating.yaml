sections:
  ag-constraint-gating: |-
    Turn policies, rules, permissions, capabilities, conditions, invariants and format into checks before, during or after execution.
  ag-policies-policy-first-gate: |-
    [PolicyGate]: Identify governing policies before planning; reject prohibited actions and retain allowed work.
  ag-safety-constraints-safe-execution-envelope: |-
    [Safety]: Protect secrets, require explicit scope for destructive writes, and redact sensitive published evidence.
  ag-business-rules-domain-rule-gate: |-
    [Rules]: Test domain rules. Example: one primary category per published pattern and at least one pattern per category file.
  ag-scope-constraints-target-membership-check: |-
    [ScopeGate]: Check every target against declared scope (e.g. under Guide/Patterns); reject unrelated paths.
  ag-capability-checks-tool-capability-gate: |-
    [CapabilityGate]: Confirm tools can read inputs, create/update Markdown and verify results.
  ag-preconditions-entry-contract: |-
    [Preconditions]: State what must hold before execution. Example: categories defined, sources available, target directory resolvable.
  ag-invariants-must-remain-true-contract: |-
    [Invariants]: State what must remain true. Example: preserve sources and canonical category names, and exclude Git history.
  ag-execution-guards-guarded-mutation: |-
    Immediately before mutation, check target path and existence, choose create/update, write complete content and verify.
  ag-formatting-constraints-render-gate: |-
    [FormatGate]: Verify the declared output format independently. Example: valid Markdown, one H1, balanced fences, and repository-relative links.
  ag-postconditions-exit-contract: |-
    [Postconditions]: Define the state required after execution.
  ag-failure-handling-bounded-failure-path: |-
    [Failure]: Stop writes to the failing path; preserve completed files, record the exact unmet condition, and continue independent work if safe.
  ag-composite-pattern-guarded-execution-contract: |-
    [Gate]: Validate policies and preconditions, check capabilities, and assert invariants. Execute only if [Gate] passes. Run [ExitGate] after execution to check postconditions and format. Apply [Failure] on any failed assertion in [ExitGate].
