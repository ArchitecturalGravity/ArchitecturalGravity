  context-triad-research-atlas: |-
    Overview maps external research and applied engineering to proposed constructs, with four expanded research regions. No association validates the framework.
  reading-the-map: |-
    Amber numbers identify publications and can repeat across regions. Geometry, positions and density do not encode measurements or evidence strength.
  construct-relationships: |-
    Locality, Shadow and Weight compose Continuity, Concentration and Momentum, then Anchoring, Trajectory and Consolidation. Composition is conceptual, not arithmetic or statistical.
  locality-research-atlas: |-
    Placement and distribution relative to use; persistence, coherent support and attachment to relevant operations. Points link through the unified research index; associations are provisional.
  semantic-locality-locality-region: |-
    Research associated with Locality within the Locality region. The association is interpretive and does not validate a derived construct.
