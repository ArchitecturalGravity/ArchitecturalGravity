sections:
  context-triad-research-atlas: |-
    Overview maps external research, internal investigations and applied engineering to proposed constructs, with four expanded research regions. No association validates the framework.
  reading-the-map: |-
    Amber numbers identify external publications; teal I-series points identify internal investigations. Both can repeat across regions; color encodes provenance, not evidence strength. Geometry, positions and density do not encode measurements or evidence strength.
  construct-relationships: |-
    Locality, Shadow and Weight compose Continuity, Concentration and Momentum, then Anchoring, Trajectory and Consolidation. Composition is conceptual, not arithmetic or statistical.
  locality-research-atlas: |-
    Placement and distribution relative to use; persistence, coherent support and attachment to relevant operations. External and internal points link through their respective research indexes; associations are provisional.
  semantic-locality-locality-region: |-
    Research associated with Locality within the Locality region. The association is interpretive and does not validate a derived construct.
