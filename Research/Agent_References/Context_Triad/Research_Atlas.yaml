  behavioral-research-atlas: |-
    Joint contextual influences and the behavioral dynamics and outcomes defined in the Context Triad paper. The center is not an additional semantic dimension. External and internal points link through their respective research indexes; associations are provisional.
  behavioral-outcomes: |-
    External and internal candidate evidence associations for behavioral outcomes. I01 and I03 motivate displacement tests; verify the required contrast before drawing conclusions.
  behavioral-dynamics: |-
    External and internal candidate evidence associations for behavioral dynamics. I02 and I03 motivate dominance, reversal or instability tests; verify the required contrast before drawing conclusions.
  adjacent-internal-investigations: |-
    I04, I07, I13 and I14 appear in the labeled strip outside the behavioral triangle. Representation, verification and operational-leverage investigations are not direct contextual-factor evidence.
  research-index: |-
    87 unique external publications retain R01–R08 and add R09–R87. Repository provenance and evidence relationships distinguish direct factors, related evidence, theory, engineering, conceptual antecedents and methodology. New associations are provisional.
  internal-research-index: |-
    I01–I14 distinguish internal studies from independent external literature. All 14 appear in regional tables and teal markers; adjacent investigations appear outside construct geometry. Three Context Triad studies report 1,110 trials across different tasks; do not pool them as an effect estimate. ARB papers concern related trials, not independent replications.
  supporting-research: |-
    Adjacent literature and methodological or cross-disciplinary work can inform tests without direct geometric placement. SWE-rebench and operational documentation are supporting resources.
  scope-and-evidence-status: |-
    The repository-citation inventory is not an exhaustive literature review. Regional and behavioral associations require source-level review; no evidence establishes independent mechanisms or validates the nine constructs.
  assets: |-
    The selective overview and its overlay retain R01–R08 and add I01–I03. Four independently editable regional SVGs preserve dimensional nodes, lavender boundaries, amber external and teal internal points; the behavioral strip marks adjacent studies outside the geometry.
  related-research: |-
    Use the framework for definitions, Studies for empirical investigations, and the model for illustration.
