  behavioral-research-atlas: |-
    Joint contextual influences and the behavioral dynamics and outcomes defined in the Context Triad paper. The center is not an additional semantic dimension. Points link through the unified research index; associations are provisional.
  behavioral-outcomes: |-
    Candidate evidence associations for behavioral outcomes from the Context Triad paper. Verify the required contrast before drawing conclusions.
  behavioral-dynamics: |-
    Candidate evidence associations for behavioral dynamics from the Context Triad paper. Verify the required contrast before drawing conclusions.
  research-index: |-
    87 unique external publications retain R01–R08 and add R09–R87. Repository provenance and evidence relationships distinguish direct factors, related evidence, theory, engineering, conceptual antecedents and methodology. New associations are provisional.
  internal-research-index: |-
    I01–I14 distinguish internal studies from independent external literature. Three Context Triad studies report 1,110 trials across different tasks; do not pool them as an effect estimate. ARB papers concern related trials, not independent replications.
  supporting-research: |-
    Adjacent literature and methodological or cross-disciplinary work can inform tests without direct geometric placement. SWE-rebench and operational documentation are supporting resources.
  scope-and-evidence-status: |-
    The repository-citation inventory is not an exhaustive literature review. Regional and behavioral associations require source-level review; no evidence establishes independent mechanisms or validates the nine constructs.
  assets: |-
    The original overview and overlay remain. Four independently editable regional SVGs preserve original dimensional nodes, lavender boundaries and amber publication overlays.
  related-research: |-
    Use the framework for definitions, Studies for empirical investigations, and the model for illustration.
