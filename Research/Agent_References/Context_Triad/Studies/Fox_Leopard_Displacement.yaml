sections:
  paper-fox-leopard-answer-displacement: |-
    Expanding Leopard increased single-animal choices without comparably changing visible pangram identification.
  a-gpt-6-luna--low-study-of-the-context-triad----21-november-2026-utc: |-
    21 November 2026: 360 scored replies, configured GPT-6 Luna / Low.
  abstract: |-
    Across 360 trials and six animal assignments, expanding Leopard increased single-animal choices; evidence of pangram identification changed little.
  role-within-the-context-triad: |-
    Separate an available cue, observed recognition, and selected animal. Leopard expansion changed competing support while the Fox–Dog cues stayed fixed within each pair.
  the-intended-inferential-correlation: |-
    Distributed quick/brown/Fox and lazy/Dog cues plus the jumping question imply the familiar pangram. Choosing Fox alone does not establish recognition.
  two-prompts-one-unchanged-implicit-cue: |-
    Leopard expands from 3 to 50 attributes without an explicit jumping claim. Fox, Dog, and the question stay fixed within each matched assignment.
  1-trial-methodology: |-
    Six assignments × 30 repeats × two prompts yielded 180 pairs in fresh Codex conversations. Each prompt was scheduled first in 15 pairs per assignment.
  2-scoring: |-
    Primary: visible full or partial pangram evidence, including explicit reference. Secondary: animal favored, ambiguous or multiple, or no selection.
  central-observation-pangram-identification-and-answer-displacement: |-
    Pangram evidence changed little overall; both Fox and Leopard gained single selections. The expansion behaved differently across assignments.
  1-evidence-of-pangram-identification: |-
    Short vs. Expanded: 34/180 vs. 31/180 showed evidence; 28 pairs favored Short and 25 Expanded (exact McNemar p = 0.784).
  2-animal-selected-in-the-final-reply: |-
    Short vs. Expanded: Fox 70 vs. 94; Leopard 58 vs. 80; no single selection 52 vs. 6, each out of 180. Dog was never selected.
  3-leopard-selection-by-displayed-slot: |-
    Expansion increased Leopard selections by 1.7, 11.7, and 23.3 percentage points from first to last slot; the two Leopard-last assignments moved oppositely.
  4-outcomes-by-animal-assignment: |-
    Leopard last: expansion changed pangram evidence 12→2/30 for Dog–Fox–Leopard and 3→15/30 for Fox–Dog–Leopard; Leopard selection 1→23/30 and 18→10/30. Dog label and question reference also differ.
  relation-to-the-context-triad: |-
    Locality frames placement, Weight frames competing support, and Shadow frames subsequent descriptions. The slot pattern does not isolate these factors.
  proposed-tests-of-semantic-weight-and-shadow: |-
    Separately vary length, relevant jump cues, and placement under matched controls; these tests are proposed.
  scope-and-evidence-status: |-
    360 scored replies with exact prompts, responses and scores. Expansion changes descriptive content and length together; animal positions and question references also vary across assignments.
  conclusion: |-
    Expansion increased single choices for both animals without a comparable change in pangram evidence. Selection depended on the full assignment, not Leopard position alone.
  1-semantic-weight-more-decisive-replies: |-
    Expanding Leopard increased single-animal choices for both Fox and Leopard; it did not produce a uniform shift toward Leopard.
  2-semantic-shadow-a-larger-advantage-in-later-slots: |-
    Leopard's expanded-block advantage was smallest first and largest last, consistent with subsequent descriptions damping influence; assignments differed.
  3-slightly-less-evidence-of-pangram-identification: |-
    Visible pangram evidence fell 1.7 percentage points under expansion; the response does not reveal unexpressed recognition.
  related-papers: |-
    Context Triad frames influence; Weight covers competing support, Shadow subsequent context, and Locality placement.
  fox-leopard-verified-stimuli: |-
    Appendix reproduces a verified Short/Expanded stimulus pair. The CSV preserves exact trial inputs, replies, and scores.
  a1-prompt-1--short-leopard-description: |-
    Verified Short example: Leopard under Animal1, Fox under Animal2, Dog under Animal3; the question asks what jumps over Animal3.
  a2-prompt-2--expanded-leopard-description: |-
    Verified Expanded example: same assignment and question as Short, with Leopard expanded from three to 50 attributes.
