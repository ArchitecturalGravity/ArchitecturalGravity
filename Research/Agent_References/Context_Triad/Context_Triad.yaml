sections:
  context-triad: |-
    The Triad explains how represented meaning can remain recoverable without governing later behavior.
  abstract: |-
    Placement, subsequent context, and relative coherent support can preserve, redirect, or suppress a meaning’s influence without removing it from context.
  introduction: |-
    Locality concerns placement relative to use; Shadow concerns later context; Weight concerns coherent support relative to competitors.
  thesis-semantic-presence-is-not-behavioral-influence: |-
    Distinguish presence, recoverability, and task influence. Retrieval alone does not show that a requirement governs execution; measure task-specific response consistency.
  the-shared-object-of-study: |-
    Measure how consistently responses follow semantic object A under a specified task and active context C. Following an earlier object may be incorrect after an authorized update.
  three-complementary-perspectives: |-
    Locality compares positions, Shadow compares semantic continuations and order, and Weight compares relative support. Use matched controls when dimensions covary.
  context-triad-interactions: |-
    Placement can condition later competition; support can offset placement; later context can shift the support needed. Compare conditional effects rather than attributing a compound change to one dimension.
  compound-context-changes: |-
    Later renaming examples can compete with an earlier preserve-identifiers rule through placement, subsequent context, and relative support. Correctness still depends on current authority.
  everyday-examples-of-the-context-triad: |-
    Hypothetical restaurant, writing, scheduling, planning, and coding cases illustrate how position, later additions, and competing support affect response consistency.
  common-behavioral-outcomes-and-dynamics: |-
    Influence can persist, weaken, strengthen, or shift as the three contextual relationships change; observed dynamics do not establish independent internal mechanisms.
  scope-and-evidence-status: |-
    The framework concerns active context and measured responses. It excludes absent or truncated context and does not infer mechanisms or causal effects from uncontrolled covariation.
  conclusion: |-
    Measure influence through position–response profiles, semantic-continuation contrasts, and support–response contrasts, separately and in combination.
  research-atlas: |-
    The Atlas maps prior research and engineering practices to primary and derived constructs; map associations are not independent validation.
  related-papers: |-
    Related work connects the illustrative model and extended constructs to representation, efficiency, capacity, and operational leverage.
