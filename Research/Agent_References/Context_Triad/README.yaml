sections:
  context-triad-portal: |-
    The research portal organizes theory, extensions, literature mapping, an illustrative model, and empirical investigations around the distinction between represented meaning and behavioral influence.
  paper-context-triad: |-
    Context_Triad.md defines the shared framework, interactions, and measurement strategy. Locality examines placement and distribution, Shadow subsequent semantic context and order, and Weight coherent support relative to competing meanings.
  extended-framework-and-research-atlas: |-
    The extended paper proposes Continuity, Concentration, Momentum, Anchoring, Trajectory, and Consolidation. Research_Atlas.md maps external research and engineering to the primary and derived constructs, distinguishing direct factor research, related evidence, and applied engineering.
  interactive-model: |-
    The model provides an interactive visual demonstration of how Locality, Shadow, and Weight may interact.
  empirical-studies: |-
    The Studies index catalogs investigations and their evidence status. Fox–Leopard examines weight and pangram inference across 360 scored trials; Planetary Order vs. Greek Genealogy compares readings of the same nine names across 13 layouts and 390 scored trials; Glip examines label, description, position, and rival-order dependence across 360 trials.
