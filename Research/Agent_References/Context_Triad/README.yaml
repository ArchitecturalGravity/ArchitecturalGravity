sections:
  context-triad--research-portal: |-
    The directory portal organizes theory, extensions, research mapping, an illustrative model, and empirical investigations around the distinction between represented meaning and its behavioral influence.
  paper-context-triad: |-
    Read Context_Triad.md for the shared framework and interactions. Its component papers address Locality (placement and distribution), Shadow (subsequent semantic history), and Weight (relative coherent support).
  extended-framework-and-research-atlas: |-
    The Extended Context Triad proposes compound and higher-order relationships; the Research Atlas relates those constructs to external research and engineering while distinguishing kinds of evidence. The proposed constructs are not established independent mechanisms.
  interactive-model: |-
    The model documentation links to a local-browser HTML visualization of the three primary dimensions. Its controls and results illustrate relationships without calibrated behavioral predictions.
  empirical-studies: |-
    The Studies index catalogs the Fox–Leopard 360-trial investigation, Planetary Chain three-condition reported pilot, and Glip 360-trial investigation. Consult the reports and supporting data for methods, observations, and limitations; inclusion does not demonstrate causality.
  reading-paths: |-
    Start with the main paper for theory, the extended paper and atlas for compound relationships, the model for visualization, or the studies for evidence. Consult cited publications to examine the external research.
  related-resources: |-
    The wider research index, agent-reference routing index, and visual assets supply additional navigation.
