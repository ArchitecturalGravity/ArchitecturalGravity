    id: "symbol_reference"
    source: "Scope:\n- [GoodName2]: value\n\nTask:\n- Use [GoodName2]\n"
    illustrates: "Explicit local symbolic declaration followed by a reference."
  -
    id: "malformed_symbol"
    source: "Task:\n- Use [badName]\n"
